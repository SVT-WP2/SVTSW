name: WPAgent

# Automatic CI/build/deploy for WPAgent (push / PR / tag only). Manual ops
# (one-off build, deploy to dev/prod) live in wp-agent-manual.yml, mirroring
# the ui.yml / ui-manual.yml and db-agent.yml / db-agent-manual.yml split.
#
# Release commits (svt-wp-agent@<version>, pushed to master by
# WPAgent :: Release) are a no-op here: every master-push job skips them,
# because the release image is built straight from the svt-wp-agent-* tag
# (docker-registry-create--release), not from the commit.
on:
  push:
    branches:
      - master
    paths:
      - 'WPAgent/**'
      - '.github/workflows/wp-agent.yml'
    tags:
      - 'svt-wp-agent-*'
  pull_request:
    paths:
      - 'WPAgent/**'
      - '.github/workflows/wp-agent.yml'

concurrency:
  group: wp-agent-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: svt-wp2/svt-wp-agent
  PYTHON_VERSION: '3.12'

defaults:
  run:
    working-directory: WPAgent

jobs:
  # Verification gate. Unlike DbAgent (compiled - the compile step IS the
  # test), WPAgent is interpreted, so this runs the unit test suite (hardware
  # SDK is stubbed in tests/conftest.py - no real prober needed) and then
  # builds the image without pushing, as a build-sanity check. Runs on PRs and
  # on normal master pushes; skipped on the svt-wp-agent@ release commit and
  # on tags (the release image builds straight from the tag in
  # docker-registry-create--release).
  build:
    if: >-
      github.event_name == 'pull_request'
      || (github.event_name == 'push' && github.ref == 'refs/heads/master' && !startsWith(github.event.head_commit.message, 'svt-wp-agent@'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies + pytest
        run: |
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir pytest
      - name: Run unit tests
        # Test files are named Test*.py (capitalized). pytest's default
        # pattern (test_*.py) is case-sensitive on the Linux runner and would
        # collect 0 items (exit code 5), so the pattern is set explicitly.
        run: python -m pytest tests/unit/ -v -o python_files="Test*.py"
      - id: vars
        run: echo "version=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: WPAgent
          file: WPAgent/Dockerfile
          target: wp-agent
          push: false
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
          cache-from: type=gha,scope=wp-agent
          cache-to: type=gha,mode=max,scope=wp-agent

  # Runtime image build + push for dev. Master push only; skipped on the
  # svt-wp-agent@ release commit (that image is built from the tag below).
  docker-registry-create:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/master'
      && !startsWith(github.event.head_commit.message, 'svt-wp-agent@')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.vars.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v5
      - id: vars
        run: echo "short_sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: WPAgent
          file: WPAgent/Dockerfile
          target: wp-agent
          push: true
          build-args: |
            VERSION=${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha,scope=wp-agent
          cache-to: type=gha,mode=max,scope=wp-agent
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}

  # Runtime image build + push for release. Tag pushes only. Builds straight
  # from the tag (no test/build gate, mirroring ui.yml / db-agent.yml).
  # Publishes :<version>, plus :latest only for stable (non-SNAPSHOT) releases.
  docker-registry-create--release:
    if: startsWith(github.ref, 'refs/tags/svt-wp-agent-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: vars
        # Strip the `svt-wp-agent-` prefix so the image tag matches the semver
        # (svt-wp-agent-1.2.3 -> 1.2.3). Stable releases also publish :latest;
        # SNAPSHOT releases do not.
        run: |
          TAG="${GITHUB_REF#refs/tags/svt-wp-agent-}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
          if ! echo "$TAG" | grep -qi "SNAPSHOT"; then
            TAGS="${TAGS}"$'\n'"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> $GITHUB_OUTPUT
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: WPAgent
          file: WPAgent/Dockerfile
          target: wp-agent
          push: true
          build-args: |
            VERSION=${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=wp-agent
          cache-to: type=gha,mode=max,scope=wp-agent
          tags: ${{ steps.vars.outputs.tags }}

  # Deploys pin the image version in /opt/docker/svtsw/dev/versions.env and
  # recreate ONLY this service inside the svt-svtsw--dev compose project (see
  # Environment/README.md). App config + secrets live in the server-side .env,
  # not in GitHub.
  deploy-dev:
    # Same guard as docker-registry-create: don't deploy version-bump commits.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/master'
      && !startsWith(github.event.head_commit.message, 'svt-wp-agent@')
    needs: docker-registry-create
    runs-on: self-hosted
    environment: dev
    steps:
      # The deploy needs Environment/ (compose files + deploy-service.sh) from
      # the repo; sparse-checkout keeps the checkout on the runner minimal.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: Environment
      - name: Deploy wp-agent to dev
        # Override the workflow-level `defaults.run.working-directory: WPAgent`
        # — the sparse checkout only materialises Environment/ and root files.
        working-directory: ${{ github.workspace }}
        env:
          IMAGE_TAG: ${{ needs.docker-registry-create.outputs.image_tag }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash Environment/deploy-service.sh dev svt-wp-agent "${IMAGE_TAG}"

  # Auto-deploy a release image to dev as soon as it's built. Runs on every
  # svt-wp-agent-* tag (any release type), after
  # docker-registry-create--release has pushed the image. Deploys the
  # release-versioned image (svt-wp-agent:<version>), replacing whatever the
  # master-push deploy-dev last pinned for the service.
  deploy-dev--release:
    if: startsWith(github.ref, 'refs/tags/svt-wp-agent-')
    needs: docker-registry-create--release
    runs-on: self-hosted
    environment: dev
    steps:
      # The deploy needs Environment/ (compose files + deploy-service.sh) from
      # the repo; sparse-checkout keeps the checkout on the runner minimal.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: Environment
      - name: Deploy wp-agent to dev
        # Override the workflow-level `defaults.run.working-directory: WPAgent`
        # — the sparse checkout only materialises Environment/ and root files.
        working-directory: ${{ github.workspace }}
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/svt-wp-agent-}"
          bash Environment/deploy-service.sh dev svt-wp-agent "${VERSION}"
