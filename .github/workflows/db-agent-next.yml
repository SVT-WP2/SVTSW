name: DbAgent Next

# Automatic CI/build/deploy for svt-db-agent-next, the NestJS re-implementation
# of the DB Agent (DbAgentNext/, a standalone app with its own package.json and
# lockfile). Manual ops (one-off build, deploy to dev/prod) live in
# db-agent-next-manual.yml, releases in db-agent-next-release.yml, mirroring the
# ui.yml / db-agent.yml split.
#
# The app also compiles the contract types of Shared/svt-ts-types (path
# aliases of DbAgentNext/tsconfig.json), so the path filter covers both
# folders. The image builds with the repository root as context.
#
# Release commits (svt-db-agent-next@<version>, pushed to master by
# DbAgent Next :: Release) are a no-op here: every master-push job skips them,
# because the release image is built straight from the svt-db-agent-next-* tag
# (docker-registry-create--release), not from the commit.
on:
  push:
    branches:
      - master
    paths:
      - 'DbAgentNext/**'
      - 'Shared/**'
      - '.github/workflows/db-agent-next.yml'
    tags:
      - 'svt-db-agent-next-*'
  pull_request:
    paths:
      - 'DbAgentNext/**'
      - 'Shared/**'
      - '.github/workflows/db-agent-next.yml'

concurrency:
  group: db-agent-next-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: svt-wp2/svt-db-agent-next
  # MikroORM 7 needs Node >= 22.17 (package.json `engines`); '22' resolves to the latest 22.x.
  NODE_VERSION: '22'

defaults:
  run:
    working-directory: DbAgentNext

jobs:
  # Lint, type-check, unit-test, build and e2e-test the app natively (fast,
  # npm-cached). Runs on PRs and on normal master pushes; skipped on release
  # commits and on tags (the release image builds straight from the tag in
  # docker-registry-create--release). The e2e suite needs a PostgreSQL service:
  # DbAgentNext/.env.test points at localhost:5500 / svt_sw_db_e2e_test with
  # postgres/postgres, which the service below provides.
  ci:
    if: >-
      github.event_name == 'pull_request'
      || (github.event_name == 'push' && github.ref == 'refs/heads/master'
          && !startsWith(github.event.head_commit.message, 'svt-db-agent-next@'))
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: svt_sw_db_e2e_test
        ports:
          - 5500:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: DbAgentNext/package-lock.json
      - run: npm ci --prefer-offline
      # The agent's own config; Shared/ is linted by ui.yml (npm run lint:shared).
      - run: npm run lint
      # tsconfig.app.json, and src/db/tsconfig.json (strict); the build checks the first one again.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Real database: migrations are applied by the harness, every table is truncated per test.
      - run: npm run e2e

  # Pull requests only: build the image the way master will, without pushing,
  # so a broken Dockerfile is caught before merge. Shares the build cache with
  # the push jobs below.
  docker-build:
    if: github.event_name == 'pull_request'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: DbAgentNext/Dockerfile
          push: false
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=db-agent-next
          cache-to: type=gha,mode=max,scope=db-agent-next

  # Runtime image build + push for dev. Master push only; skipped on release
  # commits (that image is built from the tag below).
  docker-registry-create:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/master'
      && !startsWith(github.event.head_commit.message, 'svt-db-agent-next@')
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.vars.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v5
      - id: vars
        run: echo "short_sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: DbAgentNext/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha,scope=db-agent-next
          cache-to: type=gha,mode=max,scope=db-agent-next
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}

  # Runtime image build + push for release. Tag pushes only. Builds straight
  # from the tag (no CI gate, mirroring ui.yml). Publishes :<version>, plus
  # :latest only for stable (non-SNAPSHOT) releases.
  docker-registry-create--release:
    if: startsWith(github.ref, 'refs/tags/svt-db-agent-next-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: vars
        # Strip the `svt-db-agent-next-` prefix so the image tag matches the
        # semver (svt-db-agent-next-1.2.3 -> 1.2.3). Stable releases also
        # publish :latest; SNAPSHOT releases do not.
        run: |
          TAG="${GITHUB_REF#refs/tags/svt-db-agent-next-}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
          if ! echo "$TAG" | grep -qi "SNAPSHOT"; then
            TAGS="${TAGS}"$'\n'"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> $GITHUB_OUTPUT
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: DbAgentNext/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=db-agent-next
          cache-to: type=gha,mode=max,scope=db-agent-next
          tags: ${{ steps.vars.outputs.tags }}

  # Deploys pin the image version in /opt/docker/svtsw/dev/versions.env and
  # recreate ONLY this service inside the svt-svtsw--dev compose project (see
  # Environment/README.md). App config + secrets live in the server-side .env,
  # not in GitHub.
  deploy-dev:
    # Same guard as docker-registry-create: don't deploy version-bump commits.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/master'
      && !startsWith(github.event.head_commit.message, 'svt-db-agent-next@')
    needs: docker-registry-create
    runs-on: self-hosted
    environment: dev
    steps:
      # The deploy needs Environment/ (compose files + deploy-service.sh) from
      # the repo; sparse-checkout keeps the checkout on the runner minimal.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: Environment
      - name: Deploy svt-db-agent-next to dev
        # Override the workflow-level `defaults.run.working-directory: DbAgentNext`
        # — the sparse checkout only materialises Environment/ and root files.
        working-directory: ${{ github.workspace }}
        env:
          IMAGE_TAG: ${{ needs.docker-registry-create.outputs.image_tag }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash Environment/deploy-service.sh dev svt-db-agent-next "${IMAGE_TAG}"

  # Auto-deploy a release image to dev as soon as it's built. Runs on every
  # svt-db-agent-next-* tag (any release type), after
  # docker-registry-create--release has pushed the image. Deploys the
  # release-versioned image (svt-db-agent-next:<version>), replacing whatever
  # the master-push deploy-dev last pinned for the service.
  deploy-dev--release:
    if: startsWith(github.ref, 'refs/tags/svt-db-agent-next-')
    needs: docker-registry-create--release
    runs-on: self-hosted
    environment: dev
    steps:
      # The deploy needs Environment/ (compose files + deploy-service.sh) from
      # the repo; sparse-checkout keeps the checkout on the runner minimal.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: Environment
      - name: Deploy svt-db-agent-next to dev
        # Override the workflow-level `defaults.run.working-directory: DbAgentNext`
        # — the sparse checkout only materialises Environment/ and root files.
        working-directory: ${{ github.workspace }}
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/svt-db-agent-next-}"
          bash Environment/deploy-service.sh dev svt-db-agent-next "${VERSION}"
