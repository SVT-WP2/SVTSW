name: 'DbAgent :: Manual'

# Manual-only operations, run from the Actions UI (Run workflow → pick a job).
# Extracted from db-agent.yml so that workflow stays automatic-only (push / PR /
# tag), mirroring the ui.yml / ui-manual.yml split.
on:
  workflow_dispatch:
    inputs:
      job:
        description: 'Manual job to run'
        required: true
        default: 'deploy-dev--manual'
        type: choice
        options:
          - docker-registry-create--manual
          - deploy-dev--manual
          - deploy-prod--manual
      image_tag:
        description: 'Image tag. Required for deploy-prod--manual (the release version, e.g. 1.2.3). Optional for deploy-dev--manual (defaults to short SHA). Ignored by docker-registry-create--manual (always builds short SHA).'
        required: false
        type: string

concurrency:
  # Serialize manual ops (one at a time) so concurrent deploys can't clobber
  # each other; never cancel an in-progress deploy.
  group: db-agent-manual
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: svt-wp2/svt-db-agent

defaults:
  run:
    working-directory: DbAgent

jobs:
  docker-registry-create--manual:
    if: inputs.job == 'docker-registry-create--manual'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - id: vars
        run: echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: DbAgent
          file: DbAgent/Dockerfile
          target: db-agent
          push: true
          build-args: |
            VERSION=${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=db-agent
          cache-to: type=gha,mode=max,scope=db-agent
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}

  deploy-dev--manual:
    if: inputs.job == 'deploy-dev--manual'
    runs-on: self-hosted
    environment: dev
    steps:
      - name: Deploy
        # Override the workflow-level `defaults.run.working-directory: DbAgent`
        # — this step runs on the self-hosted runner with no checkout, so the
        # DbAgent/ subdirectory doesn't exist. runner.temp is always defined
        # and always exists.
        working-directory: ${{ runner.temp }}
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          SVT_KAFKA_HOST: ${{ vars.SVT_KAFKA_HOST }}
          SVT_KAFKA_PORT: ${{ vars.SVT_KAFKA_PORT }}
          SVT_DB_HOST: ${{ vars.SVT_DB_HOST }}
          SVT_DB_PORT: ${{ vars.SVT_DB_PORT }}
          SVT_DB_USER: ${{ secrets.SVT_DB_USER }}
          SVT_DB_PASS: ${{ secrets.SVT_DB_PASS }}
          SVT_DB_NAME: ${{ secrets.SVT_DB_NAME }}
          SVT_DB_SCHEMA: ${{ secrets.SVT_DB_SCHEMA }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE_TAG="${INPUT_TAG:-${GITHUB_SHA::8}}"
          IMAGE="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          echo "Deploying ${IMAGE} locally"
          echo "${REGISTRY_TOKEN}" | sudo docker login "${REGISTRY}" -u "${REGISTRY_USER}" --password-stdin
          sudo docker pull "${IMAGE}"
          sudo docker stop svt.db-agent--dev || true
          sudo docker rm svt.db-agent--dev || true
          sudo docker run -d \
            --name svt.db-agent--dev \
            --restart unless-stopped \
            --network svt-network--dev \
            --add-host=host.docker.internal:host-gateway \
            -v /var/log/svt-db-agent/dev:/var/log/svt-db-agent \
            -e SVT_DB_AGENT_DB_HOST="${SVT_DB_HOST}" \
            -e SVT_DB_AGENT_DB_PORT="${SVT_DB_PORT}" \
            -e SVT_DB_AGENT_DB_USER="${SVT_DB_USER}" \
            -e SVT_DB_AGENT_DB_PASS="${SVT_DB_PASS}" \
            -e SVT_DB_AGENT_DB_NAME="${SVT_DB_NAME}" \
            -e SVT_DB_AGENT_DB_SCHEMA="${SVT_DB_SCHEMA}" \
            -e SVT_DB_AGENT_KAFKA_SERVER="${SVT_KAFKA_HOST}" \
            -e SVT_DB_AGENT_KAFKA_PORT="${SVT_KAFKA_PORT}" \
            "${IMAGE}"

  # Manual production deploy. Run from the Actions UI once a release image exists
  # for a `svt-db-agent-*` tag. Requires `image_tag` input (the release version,
  # e.g. 1.2.3) and the `environment: prod` approval gate (configure Required
  # reviewers in repo Settings -> Environments -> prod).
  deploy-prod--manual:
    if: inputs.job == 'deploy-prod--manual'
    runs-on: self-hosted
    environment: prod
    steps:
      - name: Deploy
        # Override the workflow-level `defaults.run.working-directory: DbAgent`
        # — this step runs on the self-hosted runner with no checkout, so the
        # DbAgent/ subdirectory doesn't exist. runner.temp is always defined
        # and always exists.
        working-directory: ${{ runner.temp }}
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          SVT_KAFKA_HOST: ${{ vars.SVT_KAFKA_HOST }}
          SVT_KAFKA_PORT: ${{ vars.SVT_KAFKA_PORT }}
          SVT_DB_HOST: ${{ vars.SVT_DB_HOST }}
          SVT_DB_PORT: ${{ vars.SVT_DB_PORT }}
          SVT_DB_USER: ${{ secrets.SVT_DB_USER }}
          SVT_DB_PASS: ${{ secrets.SVT_DB_PASS }}
          SVT_DB_NAME: ${{ secrets.SVT_DB_NAME }}
          SVT_DB_SCHEMA: ${{ secrets.SVT_DB_SCHEMA }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${INPUT_TAG}" ]]; then
            echo "ERROR: image_tag input is required for deploy-prod--manual" >&2
            exit 1
          fi
          IMAGE="${REGISTRY}/${IMAGE_NAME}:${INPUT_TAG}"
          echo "Deploying ${IMAGE} locally"
          echo "${REGISTRY_TOKEN}" | sudo docker login "${REGISTRY}" -u "${REGISTRY_USER}" --password-stdin
          sudo docker pull "${IMAGE}"
          sudo docker stop svt.db-agent--prod || true
          sudo docker rm svt.db-agent--prod || true
          sudo docker run -d \
            --name svt.db-agent--prod \
            --restart unless-stopped \
            --network svt-network--prod \
            --add-host=host.docker.internal:host-gateway \
            -v /var/log/svt-db-agent/prod:/var/log/svt-db-agent \
            -e SVT_DB_AGENT_DB_HOST="${SVT_DB_HOST}" \
            -e SVT_DB_AGENT_DB_PORT="${SVT_DB_PORT}" \
            -e SVT_DB_AGENT_DB_USER="${SVT_DB_USER}" \
            -e SVT_DB_AGENT_DB_PASS="${SVT_DB_PASS}" \
            -e SVT_DB_AGENT_DB_NAME="${SVT_DB_NAME}" \
            -e SVT_DB_AGENT_DB_SCHEMA="${SVT_DB_SCHEMA}" \
            -e SVT_DB_AGENT_KAFKA_SERVER="${SVT_KAFKA_HOST}" \
            -e SVT_DB_AGENT_KAFKA_PORT="${SVT_KAFKA_PORT}" \
            "${IMAGE}"
