name: UI

on:
  push:
    branches:
      - master
    paths:
      - 'UI/**'
      - '.github/workflows/ui.yml'
    tags:
      - 'svt-ui-*'
  pull_request:
    paths:
      - 'UI/**'
      - '.github/workflows/ui.yml'
  workflow_dispatch:
    inputs:
      job:
        description: 'Manual job to run'
        required: true
        default: 'docker-registry-create--manual'
        type: choice
        options:
          - docker-registry-create--manual
          - deploy-dev--manual
          - deploy-prod--manual
      image_tag:
        description: 'Image tag. Required for deploy-prod--manual (the release version, e.g. 1.2.3). Optional for deploy-dev--manual (defaults to short SHA). Ignored by docker-registry-create--manual (always builds short SHA).'
        required: false
        type: string

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: svt-wp2/svt-ui
  NODE_VERSION: '20.19'

defaults:
  run:
    working-directory: UI

jobs:
  install:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: UI/package-lock.json
      - run: npm ci --prefer-offline --force

  lint:
    if: github.event_name != 'workflow_dispatch'
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: UI/package-lock.json
      - run: npm ci --prefer-offline --force
      - run: npm run lint

  test:
    if: github.event_name != 'workflow_dispatch'
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: UI/package-lock.json
      - run: npm ci --prefer-offline --force
      - run: npm run test

  assemble:
    if: github.event_name != 'workflow_dispatch'
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: UI/package-lock.json
      - run: npm ci --prefer-offline --force
      - run: rm -rf .nx && npm run build::all
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: UI/dist
          retention-days: 7

  docker-registry-create:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.vars.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v5
      - id: vars
        run: echo "short_sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: UI
          file: UI/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.short_sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}

  docker-registry-create--release:
    if: startsWith(github.ref, 'refs/tags/svt-ui-')
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - id: vars
        # Strip the `svt-ui-` prefix so the image tag matches the semver
        # (svt-ui-1.2.3 -> 1.2.3). SNAPSHOT releases also publish :latest.
        run: |
          TAG="${GITHUB_REF#refs/tags/svt-ui-}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
          if echo "$TAG" | grep -qi "SNAPSHOT"; then
            TAGS="${TAGS}"$'\n'"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> $GITHUB_OUTPUT
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: UI
          file: UI/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.tag }}
          tags: ${{ steps.vars.outputs.tags }}

  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: docker-registry-create
    runs-on: self-hosted
    environment: dev
    steps:
      - name: Deploy
        # Override the workflow-level `defaults.run.working-directory: UI`
        # — this step runs on the self-hosted runner with no checkout, so the
        # UI/ subdirectory doesn't exist. runner.temp is always defined and
        # always exists.
        working-directory: ${{ runner.temp }}
        env:
          SVT_KAFKA_HOST: ${{ vars.SVT_KAFKA_HOST }}
          SVT_KAFKA_PORT: ${{ vars.SVT_KAFKA_PORT }}
          SVT_UI_PORT: ${{ vars.SVT_UI_PORT || '8090' }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::8}"
          IMAGE="${REGISTRY}/${IMAGE_NAME}:${SHORT_SHA}"
          echo "Deploying ${IMAGE} locally"
          echo "${REGISTRY_TOKEN}" | sudo docker login "${REGISTRY}" -u "${REGISTRY_USER}" --password-stdin
          sudo docker pull "${IMAGE}"
          sudo docker stop svt.ui--dev || true
          sudo docker rm svt.ui--dev || true
          sudo docker run -d \
            --name svt.ui--dev \
            --restart unless-stopped \
            --network svt-network--dev \
            --add-host=host.docker.internal:host-gateway \
            -p "${SVT_UI_PORT}:${SVT_UI_PORT}" \
            -e SVT_UI_PORT="${SVT_UI_PORT}" \
            -e KAFKA_BROKER="${SVT_KAFKA_HOST}:${SVT_KAFKA_PORT}" \
            -e APP_VERSION="${SHORT_SHA}" \
            -e NODE_ENV=production \
            "${IMAGE}"

  docker-registry-create--manual:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'docker-registry-create--manual'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - id: vars
        run: echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: UI
          file: UI/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.tag }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}

  deploy-dev--manual:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'deploy-dev--manual'
    runs-on: self-hosted
    environment: dev
    steps:
      - name: Deploy
        # Override the workflow-level `defaults.run.working-directory: UI`
        # — this step runs on the self-hosted runner with no checkout, so the
        # UI/ subdirectory doesn't exist. runner.temp is always defined and
        # always exists.
        working-directory: ${{ runner.temp }}
        env:
          SVT_KAFKA_HOST: ${{ vars.SVT_KAFKA_HOST }}
          SVT_KAFKA_PORT: ${{ vars.SVT_KAFKA_PORT }}
          SVT_UI_PORT: ${{ vars.SVT_UI_PORT || '8090' }}
          INPUT_TAG: ${{ inputs.image_tag }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE_TAG="${INPUT_TAG:-${GITHUB_SHA::8}}"
          IMAGE="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          echo "Deploying ${IMAGE} locally"
          echo "${REGISTRY_TOKEN}" | sudo docker login "${REGISTRY}" -u "${REGISTRY_USER}" --password-stdin
          sudo docker pull "${IMAGE}"
          sudo docker stop svt.ui--dev || true
          sudo docker rm svt.ui--dev || true
          sudo docker run -d \
            --name svt.ui--dev \
            --restart unless-stopped \
            --network svt-network--dev \
            --add-host=host.docker.internal:host-gateway \
            -p "${SVT_UI_PORT}:${SVT_UI_PORT}" \
            -e SVT_UI_PORT="${SVT_UI_PORT}" \
            -e KAFKA_BROKER="${SVT_KAFKA_HOST}:${SVT_KAFKA_PORT}" \
            -e APP_VERSION="${IMAGE_TAG}" \
            -e NODE_ENV=production \
            "${IMAGE}"

  # Manual production deploy. Triggered from the Actions UI after
  # `docker-registry-create--release` has published a release image for a
  # `svt-ui-*` tag. Requires `image_tag` input (the release version,
  # e.g. 1.2.3) and the `environment: prod` approval gate (configure
  # Required reviewers in repo Settings -> Environments -> prod).
  deploy-prod--manual:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'deploy-prod--manual'
    runs-on: self-hosted
    environment: prod
    steps:
      - name: Deploy
        # Override the workflow-level `defaults.run.working-directory: UI`
        # — this step runs on the self-hosted runner with no checkout, so the
        # UI/ subdirectory doesn't exist. runner.temp is always defined and
        # always exists.
        working-directory: ${{ runner.temp }}
        env:
          SVT_KAFKA_HOST: ${{ vars.SVT_KAFKA_HOST }}
          SVT_KAFKA_PORT: ${{ vars.SVT_KAFKA_PORT }}
          SVT_UI_PORT: ${{ vars.SVT_UI_PORT || '80' }}
          INPUT_TAG: ${{ inputs.image_tag }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${INPUT_TAG}" ]]; then
            echo "ERROR: image_tag input is required for deploy-prod--manual" >&2
            exit 1
          fi
          IMAGE="${REGISTRY}/${IMAGE_NAME}:${INPUT_TAG}"
          echo "Deploying ${IMAGE} locally"
          echo "${REGISTRY_TOKEN}" | sudo docker login "${REGISTRY}" -u "${REGISTRY_USER}" --password-stdin
          sudo docker pull "${IMAGE}"
          sudo docker stop svt.ui || true
          sudo docker rm svt.ui || true
          sudo docker run -d \
            --name svt.ui \
            --restart unless-stopped \
            --add-host=host.docker.internal:host-gateway \
            -p "${SVT_UI_PORT}:${SVT_UI_PORT}" \
            -e SVT_UI_PORT="${SVT_UI_PORT}" \
            -e KAFKA_BROKER="${SVT_KAFKA_HOST}:${SVT_KAFKA_PORT}" \
            -e APP_VERSION="${INPUT_TAG}" \
            -e NODE_ENV=production \
            "${IMAGE}"
