name: DbAgent

# Automatic CI/build/deploy for DbAgent (push / PR / tag only). Manual ops
# (one-off build, deploy to dev/prod) live in db-agent-manual.yml, mirroring the
# ui.yml / ui-manual.yml split.
#
# Release commits (svt-db-agent@<version>, pushed to master by DbAgent :: Release)
# are a no-op here: every master-push job skips them, because the release image
# is built straight from the svt-db-agent-* tag (docker-registry-create--release),
# not from the commit.
on:
  push:
    branches:
      - master
    paths:
      - 'DbAgent/**'
      - '.github/workflows/db-agent.yml'
    tags:
      - 'svt-db-agent-*'
  pull_request:
    paths:
      - 'DbAgent/**'
      - '.github/workflows/db-agent.yml'

concurrency:
  group: db-agent-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: svt-wp2/svt-db-agent

defaults:
  run:
    working-directory: DbAgent

jobs:
  # Compile-only verification. Builds the `db-agent-build` Dockerfile stage
  # without pushing. Runs on PRs and on normal master pushes; skipped on the
  # svt-db-agent@ release commit and on tags (the release image builds straight
  # from the tag in docker-registry-create--release).
  build:
    if: >-
      github.event_name == 'pull_request'
      || (github.event_name == 'push' && github.ref == 'refs/heads/master' && !startsWith(github.event.head_commit.message, 'svt-db-agent@'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: vars
        run: echo "version=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: DbAgent
          file: DbAgent/Dockerfile
          target: db-agent-build
          push: false
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
          cache-from: type=gha,scope=db-agent
          cache-to: type=gha,mode=max,scope=db-agent

  # Runtime image build + push for dev. Master push only; skipped on the
  # svt-db-agent@ release commit (that image is built from the tag below).
  docker-registry-create:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/master'
      && !startsWith(github.event.head_commit.message, 'svt-db-agent@')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.vars.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v5
      - id: vars
        run: echo "short_sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: DbAgent
          file: DbAgent/Dockerfile
          target: db-agent
          push: true
          build-args: |
            VERSION=${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha,scope=db-agent
          cache-to: type=gha,mode=max,scope=db-agent
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}

  # Runtime image build + push for release. Tag pushes only. Builds straight from
  # the tag (no compile-gate, mirroring ui.yml). Publishes :<version>, plus
  # :latest only for stable (non-SNAPSHOT) releases.
  docker-registry-create--release:
    if: startsWith(github.ref, 'refs/tags/svt-db-agent-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: vars
        # Strip the `svt-db-agent-` prefix so the image tag matches the semver
        # (svt-db-agent-1.2.3 -> 1.2.3). Stable releases also publish :latest;
        # SNAPSHOT releases do not.
        run: |
          TAG="${GITHUB_REF#refs/tags/svt-db-agent-}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
          if ! echo "$TAG" | grep -qi "SNAPSHOT"; then
            TAGS="${TAGS}"$'\n'"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> $GITHUB_OUTPUT
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: DbAgent
          file: DbAgent/Dockerfile
          target: db-agent
          push: true
          build-args: |
            VERSION=${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=db-agent
          cache-to: type=gha,mode=max,scope=db-agent
          tags: ${{ steps.vars.outputs.tags }}

  deploy-dev:
    # Same guard as docker-registry-create: don't deploy version-bump commits.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/master'
      && !startsWith(github.event.head_commit.message, 'svt-db-agent@')
    needs: docker-registry-create
    runs-on: self-hosted
    environment: dev
    steps:
      - name: Deploy
        # Override the workflow-level `defaults.run.working-directory: DbAgent`
        # — this step runs on the self-hosted runner with no checkout, so the
        # DbAgent/ subdirectory doesn't exist. runner.temp is always defined
        # and always exists.
        working-directory: ${{ runner.temp }}
        env:
          SVT_KAFKA_HOST: ${{ vars.SVT_KAFKA_HOST }}
          SVT_KAFKA_PORT: ${{ vars.SVT_KAFKA_PORT }}
          SVT_DB_HOST: ${{ vars.SVT_DB_HOST }}
          SVT_DB_PORT: ${{ vars.SVT_DB_PORT }}
          SVT_DB_USER: ${{ secrets.SVT_DB_USER }}
          SVT_DB_PASS: ${{ secrets.SVT_DB_PASS }}
          SVT_DB_NAME: ${{ secrets.SVT_DB_NAME }}
          SVT_DB_SCHEMA: ${{ secrets.SVT_DB_SCHEMA }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::8}"
          IMAGE="${REGISTRY}/${IMAGE_NAME}:${SHORT_SHA}"
          echo "Deploying ${IMAGE} locally"
          echo "${REGISTRY_TOKEN}" | sudo docker login "${REGISTRY}" -u "${REGISTRY_USER}" --password-stdin
          sudo docker pull "${IMAGE}"
          sudo docker stop svt.db-agent--dev || true
          sudo docker rm svt.db-agent--dev || true
          sudo docker run -d \
            --name svt.db-agent--dev \
            --restart unless-stopped \
            --network svt-network--dev \
            --add-host=host.docker.internal:host-gateway \
            -v /var/log/svt-db-agent/dev:/var/log/svt-db-agent \
            -e SVT_DB_AGENT_DB_HOST="${SVT_DB_HOST}" \
            -e SVT_DB_AGENT_DB_PORT="${SVT_DB_PORT}" \
            -e SVT_DB_AGENT_DB_USER="${SVT_DB_USER}" \
            -e SVT_DB_AGENT_DB_PASS="${SVT_DB_PASS}" \
            -e SVT_DB_AGENT_DB_NAME="${SVT_DB_NAME}" \
            -e SVT_DB_AGENT_DB_SCHEMA="${SVT_DB_SCHEMA}" \
            -e SVT_DB_AGENT_KAFKA_SERVER="${SVT_KAFKA_HOST}" \
            -e SVT_DB_AGENT_KAFKA_PORT="${SVT_KAFKA_PORT}" \
            "${IMAGE}"

  # Auto-deploy a release image to dev as soon as it's built. Runs on every
  # svt-db-agent-* tag (any release type), after docker-registry-create--release
  # has pushed the image. Deploys the release-versioned image
  # (svt-db-agent:<version>), replacing whatever the master-push deploy-dev last
  # put on the dev container.
  deploy-dev--release:
    if: startsWith(github.ref, 'refs/tags/svt-db-agent-')
    needs: docker-registry-create--release
    runs-on: self-hosted
    environment: dev
    steps:
      - name: Deploy
        # Override the workflow-level `defaults.run.working-directory: DbAgent`
        # — this step runs on the self-hosted runner with no checkout, so the
        # DbAgent/ subdirectory doesn't exist. runner.temp is always defined
        # and always exists.
        working-directory: ${{ runner.temp }}
        env:
          SVT_KAFKA_HOST: ${{ vars.SVT_KAFKA_HOST }}
          SVT_KAFKA_PORT: ${{ vars.SVT_KAFKA_PORT }}
          SVT_DB_HOST: ${{ vars.SVT_DB_HOST }}
          SVT_DB_PORT: ${{ vars.SVT_DB_PORT }}
          SVT_DB_USER: ${{ secrets.SVT_DB_USER }}
          SVT_DB_PASS: ${{ secrets.SVT_DB_PASS }}
          SVT_DB_NAME: ${{ secrets.SVT_DB_NAME }}
          SVT_DB_SCHEMA: ${{ secrets.SVT_DB_SCHEMA }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/svt-db-agent-}"
          IMAGE="${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          echo "Deploying ${IMAGE} locally"
          echo "${REGISTRY_TOKEN}" | sudo docker login "${REGISTRY}" -u "${REGISTRY_USER}" --password-stdin
          sudo docker pull "${IMAGE}"
          sudo docker stop svt.db-agent--dev || true
          sudo docker rm svt.db-agent--dev || true
          sudo docker run -d \
            --name svt.db-agent--dev \
            --restart unless-stopped \
            --network svt-network--dev \
            --add-host=host.docker.internal:host-gateway \
            -v /var/log/svt-db-agent/dev:/var/log/svt-db-agent \
            -e SVT_DB_AGENT_DB_HOST="${SVT_DB_HOST}" \
            -e SVT_DB_AGENT_DB_PORT="${SVT_DB_PORT}" \
            -e SVT_DB_AGENT_DB_USER="${SVT_DB_USER}" \
            -e SVT_DB_AGENT_DB_PASS="${SVT_DB_PASS}" \
            -e SVT_DB_AGENT_DB_NAME="${SVT_DB_NAME}" \
            -e SVT_DB_AGENT_DB_SCHEMA="${SVT_DB_SCHEMA}" \
            -e SVT_DB_AGENT_KAFKA_SERVER="${SVT_KAFKA_HOST}" \
            -e SVT_DB_AGENT_KAFKA_PORT="${SVT_KAFKA_PORT}" \
            "${IMAGE}"
