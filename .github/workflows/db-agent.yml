name: DbAgent

# Compile check of the frozen C++ DbAgent, on a pull request or a master push
# that touches DbAgent/. Nothing else: no image is pushed, no release is made
# and nothing is deployed. svt-db-agent-next (DbAgentNext/, db-agent-next*.yml)
# is the DB agent of every environment; the image, release and deploy pipelines
# of the C++ agent were removed in 2026-11.
on:
  push:
    branches:
      - master
    paths:
      - 'DbAgent/**'
      - '.github/workflows/db-agent.yml'
  pull_request:
    paths:
      - 'DbAgent/**'
      - '.github/workflows/db-agent.yml'

concurrency:
  group: db-agent-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: DbAgent

jobs:
  # Builds the `db-agent-build` Dockerfile stage (the compile) without a push.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: vars
        run: echo "version=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: DbAgent
          file: DbAgent/Dockerfile
          target: db-agent-build
          push: false
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
          cache-from: type=gha,scope=db-agent
          cache-to: type=gha,mode=max,scope=db-agent
