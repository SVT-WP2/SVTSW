openapi: 3.0.3
info:
  title: SVT Wafer Prober Agent API (Kafka Command Contract)
  version: 2.2.0
  description: |
    This OpenAPI document describes the message contract for the SVT Wafer Prober Agent. The agent consumes Kafka messages on topic `svt.wp-agent.request` and replies on `svt.wp-agent.reply`.
    
    **What you send:** Only type and params fields. The kafka_client automatically adds requestId, sent_at, and reply_to.
    
    **What you receive:** The kafka_client wraps the command result with type (specific to command), requestId, command, status, output, execution_time_ms, and timestamp.
    
    Some commands also include a data field with structured information.

servers:
  - url: kafka://localhost:9092/svt.wp-agent.request
    description: Kafka request topic

tags:
  - name: "1. USER LEVEL"
    description: Basic operations for standard users - Initialize, Load/Unload wafer, Step to next die, Separation control, Probe alignment
  - name: "2. EXPERT LEVEL"
    description: Advanced operations - Movement control, Vision, Status queries, Database access, Automation, Kafka messaging
  - name: "3. VERY EXPERT LEVEL"
    description: System-level operations - Reset agent, Advanced movement (XY/Die), Contact control, Auto-focus, Wafer alignment

paths:

  #########################
  # USER LEVEL
  #########################

  /svt.wp-agent.request/WPAGInitialize:
    post:
      tags: ["1. USER LEVEL"]
      summary: Initialize connection to wafer prober
      description: |
        Three initialization modes:
        
        **1. Manual Mode** - Direct connection with explicit parameters
          - Required: address, machineType
          - Optional: projectName, alignmentDie, homeDie, force
          - Use when you know exact prober address and settings
        
        **2. Database Interactive Mode** - User-guided selection
          - Required: withDB=true
          - Optional: force
          - Agent prompts user interactively to select machine and project from database
          - Best for exploration or manual configuration
        
        **3. Serial Number Mode** - Fully automatic initialization ⭐ NEW!
          - Required: serialNumber (chip serial number, e.g. "W1_1_1")
          - Optional: force
          - Automatically resolves everything from database:
            * Finds ASIC by serial number
            * Retrieves wafer information (waferId, familyType, location)
            * Matches machine by location (wafer.generalLocation == machine.generalLocation)
            * Determines orientation from machine.loadedWafer.orientation
            * Auto-generates project name: `ER2_{familyType}_Vertical_{orientation}`
            * Opens project automatically
          - Best for automated testing workflows where only chip serial is known
          - No user interaction required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitializeRequest'
            examples:
              ManualMode:
                summary: Manual initialization with explicit parameters
                value:
                  type: "Initialize"
                  params:
                    address: "string"
                    machineType: "string"
                    projectName: "string"
                    alignmentDie: "string"
                    homeDie: "string"

              DatabaseMode:
                summary: Interactive database selection
                value:
                  type: "Initialize"
                  params:
                    withDB: true

              SerialNumberMode:
                summary: Auto-resolve everything by chip serial (NEW! ⭐)
                value:
                  type: "Initialize"
                  params:
                    serialNumber: "string"
                    force: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReply'
              examples:
                ManualModeSuccess:
                  value:
                    type: "InitializeReply"
                    requestId: "string"
                    command: "string"
                    status: "success"
                    output: "Initialized WP at WPMIT01.cern.ch:35555"
                    execution_time_ms: 0.0
                    timestamp: 0.0

                SerialNumberModeSuccess:
                  value:
                    type: "InitializeReply"
                    requestId: "string"
                    command: "string"
                    status: "success"
                    output: |
                      Step 1/3: Finding chip...
                         ✅ Found ASIC 'W1_1_1' at offset 0
                         ✅ ASIC: serial=W1_1_1, waferId=1, family=BABYMOST
                      
                      Step 2/3: Finding wafer location and machine...
                         ✅ Got 1 wafer(s)
                         📍 Wafer location: CERN_186_R_E10
                         ✅ Got 3 machine(s)
                         ✅ Machine: WPMIT01 at WPMIT0101.WPMIT01:2002
                         ✅ Location: CERN_186_R_E10, Orientation: North
                      
                      Step 3/3: Finding project...
                         ✅ Got 5 project(s)
                         🔍 Looking for project: ER2_BABYMOST_Vertical_North
                         ✅ Found project: ER2_BABYMOST_Vertical_North (id=5)
                      
                      ✅ Initialization successful!
                      
                      Connected to WPMIT0101.WPMIT01:2002
                      Machine: WPMIT01
                      Project: ER2_BABYMOST_Vertical_North
                    execution_time_ms: 0.0
                    timestamp: 0.0
                    data:
                      asic_serial: "string"
                      wafer_id: 0
                      family_type: "string"
                      orientation: "North"
                      machineName: "string"
                      machine_address: "string"
                      projectName: "string"
                      projectId: 0
                      location: "string"
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReply'
              examples:
                MissingParams:
                  value:
                    type: "InitializeReply"
                    requestId: "string"
                    command: "string"
                    status: "error"
                    output: "Initialization requires 'address' and 'machineType' parameters, OR 'withDB=true', OR 'serialNumber'"
                    execution_time_ms: 0.0
                    timestamp: 0.0

                AsicNotFound:
                  value:
                    type: "InitializeReply"
                    requestId: "string"
                    command: "string"
                    status: "error"
                    output: "Step 1/3: Finding chip... ❌ ASIC 'INVALID_123' not found in database"
                    execution_time_ms: 0.0
                    timestamp: 0.0

