components:
  schemas:
    # Generic request envelope used by most commands
    CommandRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          description: Command name
          example: "ShowProjectStatus"
        params:
          type: object
          description: Command-specific parameters
          additionalProperties: true

    # Specialized request for Initialize (with detailed params)
    InitializeRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [Initialize]
        params:
          type: object
          required: [serialNumber]
          properties:
            serialNumber:
              type: string
              description: ASIC serial number being tested
              example: "ASIC_12345"
            address:
              type: string
              example: "WPMIT01.cern.ch:35555"
            machine_type:
              type: string
              example: "sentio"
            project_name:
              type: string
            alignment_die:
              type: string
              example: "2,2,0"
            home_die:
              type: string
              example: "5,2,0"
            force:
              type: boolean
            with_db:
              type: boolean

    # What kafka_client sends back
    CommandReply:
      type: object
      required: [type, request_id, command, status, output, execution_time_ms, timestamp]
      properties:
        type:
          type: string
          enum: [CommandReply]
        request_id:
          type: string
          format: uuid
        command:
          type: string
        status:
          type: string
          enum: [success, error]
        output:
          type: string
        execution_time_ms:
          type: number
          format: double
        timestamp:
          type: number
          format: double
        data:
          type: object
          nullable: true
          description: Optional extra structured payload
          additionalProperties: true
    # ========================================
    # Kafka Message Schemas
    # ========================================

    RequestMessage:
      type: object
      required:
        - type
      properties:
        type:
          type: string
        data:
          type: object
    ReplyMessage:
      type: object
      required:
        - status
        - type
      properties:
        status:
          $ref: "#/components/schemas/ReplyStatus"
        type:
          type: string
        data:
          type: object
        error:
          type: object
          required:
            - message
          properties:
            code:
              type: number
            message:
              type: string
    EventMessage:
      type: object
      required:
        - type
      properties:
        type:
          type: string
        data:
          type: object
    ReplyStatus:
      type: string
      enum:
        - Success
        - BadRequest
        - NotFound
        - UnexpectedError
    #          
    # LOAD WAFER
    #
    LoadWaferMessage:
      properties:
        type:
          type: string
          default: 'LoadWafer'
        data:
          type: object
          required:
            - wpMachineId
            - waferId
            - orientation
          properties:
            wpMachineId:
              type: number
              description: Wafer Probe Machine id
            waferId:
              type: number
              description: Wafer id to be loaded
            orientation:
              type: string
              description: Wafer id to be loaded

    LoadWaferReplyMessage:
      properties:
        type:
          type: string
          default: 'LoadWaferReply'
        data:
          $ref: "#/components/schemas/WpMachineStateDto"
    #          
    # UNLOAD WAFER
    #
    UnloadWaferMessage:
      properties:
        type:
          type: string
          default: 'UnloadWafer'
        data:
          type: object
          required:
            - wpMachineId
          properties:
            wpMachineId:
              type: number
              description: Wafer Probe Machine id

    UnloadWaferReplyMessage:
      properties:
        type:
          type: string
          default: 'UnloadWaferReply'
        data:
          $ref: "#/components/schemas/WpMachineStateDto"

    #
    # WP MACHINE STATE CHNAGED
    #
    WpMachineStateChangedMessage:
      properties:
        type:
          type: string
          default: 'WpMachineStateChanged'
        data:
          $ref: "#/components/schemas/WpMachineStateDto"

    #
    # GET WP MACHINE STATE
    #
    GetWpMachineStateMessage:
      properties:
        type:
          type: string
          default: 'GetWpMachineState'
        data:
          type: object
          required:
            - wpMachineId
          properties:
            wpMachineId:
              type: number
              description: Wafer Probe Machine id
