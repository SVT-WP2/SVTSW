  /svt.wp-agent.request/GetChuckPosition:
    post:
      tags: [Status]
      summary: Get current chuck position status
      description: |
        Returns the current position of the chuck (Contact, Separation, Default, etc.)
        Uses Sentio command: status:get_prop Z_Position_Hint, chuck
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
            examples:
              NoParams:
                value:
                  type: "GetChuckPosition"
                  params:
                      serialNumber: "ASIC_12345"
      responses:
        '200':
          description: Position retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommandReply'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          position:
                            type: string
                            description: Current chuck position
                            enum: [In Contact, In Separation, In Default, In Hover, In Lift, In Home, In Overtravel]
              examples:
                Contact:
                  value:
                    type: "CommandReply"
                    request_id: "pos-001"
                    command: "GetChuckPosition"
                    status: "success"
                    output: "Chuck is In Contact"
                    execution_time_ms: 9.6
                    timestamp: 1733156000.010
                    data:
                      position: "In Contact"
