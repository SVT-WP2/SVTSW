components:
  schemas:
    # Generic request envelope used by most commands
    CommandRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          description: Command name
          example: "ShowProjectStatus"
        params:
          type: object
          description: Command-specific parameters
          additionalProperties: true

    # Specialized request for Initialize (with detailed params)
    InitializeRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [Initialize]
        params:
          type: object
          properties:
            address:
              type: string
              example: "WPMIT01.cern.ch:35555"
            machine_type:
              type: string
              example: "sentio"
            project_name:
              type: string
            alignment_die:
              type: string
              example: "2,2,0"
            home_die:
              type: string
              example: "5,2,0"
            force:
              type: boolean
            with_db:
              type: boolean

    # What kafka_client sends back
    CommandReply:
      type: object
      required: [type, request_id, command, status, output, execution_time_ms, timestamp]
      properties:
        type:
          type: string
          enum: [CommandReply]
        request_id:
          type: string
          format: uuid
        command:
          type: string
        status:
          type: string
          enum: [success, error]
        output:
          type: string
        execution_time_ms:
          type: number
          format: double
        timestamp:
          type: number
          format: double
        data:
          type: object
          nullable: true
          description: Optional extra structured payload
          additionalProperties: true
