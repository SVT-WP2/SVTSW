components:
  schemas:
    CommandRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
        params:
          type: object
          additionalProperties: true

    InitializeRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [Initialize]
        params:
          type: object
          properties:
            serialNumber:
              type: string
            address:
              type: string
            machineType:
              type: string
              enum: ["sentio", "summit"]
            projectName:
              type: string
            alignmentDie:
              type: string
            homeDie:
              type: string
            force:
              type: boolean
            withDB:
              type: boolean

    CommandReply:
      type: object
      required: [type, requestId, command, status, output, execution_time_ms, timestamp]
      properties:
        type:
          type: string
          description: Specific reply type for each command (e.g. "InitializeReply", "LoadReply")
        requestId:
          type: string
        command:
          type: string
        status:
          type: string
          enum: [success, error]
        output:
          type: string
        execution_time_ms:
          type: number
        timestamp:
          type: number
        data:
          type: object
          nullable: true
          additionalProperties: true

    RequestMessage:
      type: object
      required: [type]
      properties:
        type:
          type: string
        data:
          type: object

    ReplyMessage:
      type: object
      required: [status, type]
      properties:
        status:
          $ref: "#/components/schemas/ReplyStatus"
        type:
          type: string
        data:
          type: object
        error:
          type: object
          properties:
            code:
              type: number
            message:
              type: string

    EventMessage:
      type: object
      required: [type]
      properties:
        type:
          type: string
        data:
          type: object

    ReplyStatus:
      type: string
      enum: [Success, BadRequest, NotFound, UnexpectedError]

    LoadWaferMessage:
      properties:
        type:
          type: string
          default: 'LoadWafer'
        data:
          type: object
          required: [wpMachineId, waferId, orientation]
          properties:
            wpMachineId:
              type: number
            waferId:
              type: number
            orientation:
              type: string

    LoadWaferReplyMessage:
      properties:
        type:
          type: string
          default: 'LoadWaferReply'
        data:
          $ref: "#/components/schemas/WpMachineStateDto"

    UnloadWaferMessage:
      properties:
        type:
          type: string
          default: 'UnloadWafer'
        data:
          type: object
          required: [wpMachineId]
          properties:
            wpMachineId:
              type: number

    UnloadWaferReplyMessage:
      properties:
        type:
          type: string
          default: 'UnloadWaferReply'
        data:
          $ref: "#/components/schemas/WpMachineStateDto"

    WpMachineStateChangedMessage:
      properties:
        type:
          type: string
          default: 'WpMachineStateChanged'
        data:
          $ref: "#/components/schemas/WpMachineStateDto"

    GetWpMachineStateMessage:
      properties:
        type:
          type: string
          default: 'GetWpMachineState'
        data:
          type: object
          required: [wpMachineId]
          properties:
            wpMachineId:
              type: number

    GetWpMachineStateReplyMessage:
      properties:
        type:
          type: string
          default: 'GetWpMachineStateReply'
        data:
          $ref: "#/components/schemas/WpMachineStateDto"

    SetChuckZPositionStateMessage:
      properties:
        type:
          type: string
          default: 'SetChuckZPositionState'
        data:
          type: object
          required: [wpMachineId, chuckZPositionState]
          properties:
            wpMachineId:
              type: number
            chuckZPositionState:
              $ref: "#/components/schemas/WpChuckZPositionState"

    SetChuckZPositionStateReplyMessage:
      properties:
        type:
          type: string
          default: 'SetChuckZPositionStateReply'
        data:
          $ref: "#/components/schemas/WpMachineStateDto"

    MoveChuckHomeMessage:
      properties:
        type:
          type: string
          default: 'MoveChuckHome'
        data:
          type: object
          required: [wpMachineId]
          properties:
            wpMachineId:
              type: number

    MoveChuckHomeReplyMessage:
      properties:
        type:
          type: string
          default: 'MoveChuckHomeReply'
        data:
          $ref: "#/components/schemas/WpMachineStateDto"

    MoveChuckDieMessage:
      properties:
        type:
          type: string
          default: 'MoveChuckDie'
        data:
          type: object
          required: [wpMachineId, waferMapDiePosition]
          properties:
            wpMachineId:
              type: number
            waferMapDiePosition:
              $ref: "#/components/schemas/WaferMapDiePosition"

    MoveChuckDieReplyMessage:
      properties:
        type:
          type: string
          default: 'MoveChuckDieReply'
        data:
          $ref: "#/components/schemas/WpMachineStateDto"

    MoveChuckAsicMessage:
      properties:
        type:
          type: string
          default: 'MoveChuckAsic'
        data:
          type: object
          required: [wpMachineId, asicId]
          properties:
            wpMachineId:
              type: number
            asicId:
              type: number

    MoveChuckAsicReplyMessage:
      properties:
        type:
          type: string
          default: 'MoveChuckAsicReply'
        data:
          $ref: "#/components/schemas/WpMachineStateDto"

    WpMachineStateDto:
      type: object
      required: [wpMachineId, wpMachineStatus]
      properties:
        wpMachineId:
          type: number
        wpMachineStatus:
          $ref: "#/components/schemas/WpMachineStatus"
        loadedWafer:
          type: object
          nullable: true
          properties:
            waferId:
              type: number
            orientation:
              type: string
        installedProbeCard:
          type: object
          nullable: true
          properties:
            probeCardId:
              type: number
            orientation:
              type: string
        openedProjectId:
          type: number
          nullable: true
        waferMapDiePosition:
          $ref: "#/components/schemas/WaferMapDiePosition"
        chuckAbsolutePosition:
          $ref: "#/components/schemas/ChuckAbsolutePosition"
        chuckZPositionState:
          $ref: "#/components/schemas/WpChuckZPositionState"

    WaferMapDiePosition:
      required: [colIndex, rowIndex]
      properties:
        colIndex:
          type: number
        rowIndex:
          type: number
        subsiteIndex:
          type: number
          nullable: true

    ChuckAbsolutePosition:
      required: [x, y, z]
      properties:
        x:
          type: number
        y:
          type: number
        z:
          type: number

    WpMachineStatus:
      type: string
      enum: [Idle, Processing, Offline, Error]

    WpChuckZPositionState:
      type: string
      enum: [Contact, Separation, Lift]