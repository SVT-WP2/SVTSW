openapi: 3.0.3
info:
  title: SVT Wafer Prober Agent API (Kafka Command Contract)
  version: 2.0.0
  description: >
    This OpenAPI document describes the message contract for the SVT Wafer Prober Agent.
    The agent consumes Kafka messages on topic `svt.wp-agent.request` and replies on `svt.wp-agent.reply`.
    
    ## -
      What you send: Only type and params fields. The kafka_client automatically adds
    request_id, sent_at, and reply_to.
    
    ## -
      What you receive: The kafka_client wraps the command result with
    type=CommandReply, request_id, command, status, output, execution_time_ms, and timestamp.
    
    
    Some commands also include a data field with structured information.

servers:
  - url: kafka://localhost:9092/svt.wp-agent.request
    description: Kafka request topic

tags:
  - name: Setup
  - name: Wafer Handling
  - name: Movement
  - name: Positioning
  - name: Probe Control
  - name: Vision
  - name: Alignment
  - name: Testing
  - name: Status
  - name: System
  - name: Database
  - name: Automation

paths:

  #########################
  # Setup
  #########################

  /svt.wp-agent.request/Initialize:
    post:
      tags: [Setup]
      summary: Initialize connection to wafer prober
      description: |
        Two initialization modes:
        1. Manual: Provide address and machine_type
        2. Database: Use with_db=true for interactive selection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitializeRequest'
            examples:
              Manual:
                value:
                  type: "Initialize"
                  params:
                    address: "WPMIT01.cern.ch:35555"
                    machine_type: "sentio"
              ManualWithProject:
                value:
                  type: "Initialize"
                  params:
                    address: "WPMIT01.cern.ch:35555"
                    machine_type: "sentio"
                    project_name: "NKF7_Test"
                    alignment_die: "2,2,0"
                    home_die: "5,2,0"
              Database:
                value:
                  type: "Initialize"
                  params:
                    with_db: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReply'
              examples:
                Success:
                  value:
                    type: "CommandReply"
                    request_id: "abc-123"
                    command: "Initialize"
                    status: "success"
                    output: "Initialized WP at WPMIT01.cern.ch:35555"
                    execution_time_ms: 8234.5
                    timestamp: 1733155208.234
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReply'
              examples:
                MissingParams:
                  value:
                    type: "CommandReply"
                    request_id: "abc-123"
                    command: "Initialize"
                    status: "error"
                    output: "Initialization requires 'address' and 'machine_type' parameters"
                    execution_time_ms: 0.1
                    timestamp: 1733155200.1

