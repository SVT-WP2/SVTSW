# TakeImageSequenceLEC.yaml
params:
  user:
  waferAgentName:
  segs: ["SEG4"]
  num_columns: 91 #91
  num_rows: 43 #9
  column_spacing_um: -2968
  row_spacing_um: 2476
  start_x_um: -21088
  start_y_um: -27245
  settle_time_s: 1
  snapshot_type: "CameraRaw"
  save_locally: true
  # Output base folder: images go to  Imaging/<wafer>/<die>/
  # Override at runtime: --data='{"wafer":"Wafer25", ...}'
  wafer: "Wafer"
  seg_save_jpg: true
  seg_save_tif: true
  tif_quality: 85

steps:

  # - command: OpenProject
  #   params:
  #     projectName: ER2_babyMOSAIX_Vertical_V0_NotchW_ArrowW
  #     user: $user
  #     waferAgentName: $waferAgentName

  # - command: InitProbing
  #   params:
  #     user: $user
  #     waferAgentName: $waferAgentName

  # - command: OpenProject
  #   params:
  #     projectName: ER2_MOSAIX_Vertical_V0_NotchW_ArrowW
  #     user: $user
  #     waferAgentName: $waferAgentName

  - foreach: $segs
    as: die
    steps:

      - command: MoveChuckRowColumn
        params:
          user: $user
          waferAgentName: $waferAgentName
          label: $die

      - command: GenerateRasterSteps
        as: raster
        params:
          user: $user
          waferAgentName: $waferAgentName
          num_columns: $num_columns
          num_rows: $num_rows
          column_spacing_um: $column_spacing_um
          row_spacing_um: $row_spacing_um
          start_x_um: $start_x_um
          start_y_um: $start_y_um

      - foreach: $raster.steps
        as: rs
        steps:

          - command: MoveChuckXY
            params:
              user: $user
              waferAgentName: $waferAgentName
              x: $rs.x
              y: $rs.y
              position: "Relative"
            when: "$rs.action == move"

          - command: Sleep
            params:
              user: $user
              waferAgentName: $waferAgentName
              seconds: $rs.settle
            when: "$rs.action == move"
            
          - command: TakeScreenshot
            params:
              user: $user
              waferAgentName: $waferAgentName
              fileName: $rs.filename
              outputDir: "SEG"
              wafer: $wafer
              snapshot_type: $snapshot_type
              save_locally: $save_locally
            when: "$rs.action == snapshot"

      - command: StitchImagesFull
        params:
          user: $user
          waferAgentName: $waferAgentName
          folder: "SEG"
          wafer: $wafer
          save_overview_jpg: $seg_save_jpg
          pyramid_tiff: $seg_save_tif
          tiff_quality: $tif_quality

      - command: CleanupRasterImages
        params:
          user: $user
          waferAgentName: $waferAgentName
          folder: "SEG"
          wafer: $wafer

      - command: ArchiveImaging
        params:
        user: $user
        waferAgentName: $waferAgentName
        source_dir: "Imaging"
        dest_dir: "/eos/project/a/aliceits3/ITS3-WP3/MOSAIX/prober_imaging"