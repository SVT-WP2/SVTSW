# FlatfieldCalibration.yaml
#
# Illumination flatfield of a wafer, WITHOUT opening a project: the steps of
# BrightnessCorrection.yaml from "MoveChuckCenter" on, so it can run in whatever
# project is open (e.g. ER2B) and as a step of another sequence.
#
#   1. Go to the wafer centre
#   2. Capture a small grid of tiles (default 5x5)
#   3. Build the flatfield model from those tiles (luminance median + smooth)
#   4. Clean up the tile images - only flatfield.npy is kept
#
# Output: Imaging/<wafer>/CALIBRATION_COLOR/flatfield.npy, found automatically by
# StitchImagesFull (TakeImageLECDie) for the same <wafer>. Kept locally by ArchiveImaging.
# Once per wafer is enough.

params:
  user:
  waferAgentName:
  flatfield_die: "CALIBRATION_COLOR"
  num_columns: 5
  num_rows: 5
  column_spacing_um: -2968
  row_spacing_um: 2476
  start_x_um: -21088
  start_y_um: -27245
  col_settle_time_s: 0.2
  row_settle_time_s: 1
  snapshot_type: "CameraRaw"
  save_locally: true
  wafer: "Wafer"
  # Gaussian sigma (px) for smoothing the median — keep large relative to
  # device feature size so only the slow illumination gradient is captured.
  flatfield_sigma: 300
  # Output filename (saved inside Imaging/<wafer>/<flatfield_die>/)
  flatfield_output: "flatfield.npy"

steps:

  - command: MoveChuckCenter
    params:
      user: $user
      waferAgentName: $waferAgentName

  # ── Capture calibration grid at wafer centre ────────────────────────
  - command: GenerateRasterSteps
    as: raster
    params:
      user: $user
      waferAgentName: $waferAgentName
      num_columns: $num_columns
      num_rows: $num_rows
      column_spacing_um: $column_spacing_um
      row_spacing_um: $row_spacing_um
      start_x_um: $start_x_um
      start_y_um: $start_y_um
      col_settle_time_s: $col_settle_time_s
      row_settle_time_s: $row_settle_time_s
      wafer: $wafer
      y_col_correction_um: 0.0
      x_row_correction_um: 0.0

  - foreach: $raster.steps
    as: rs
    steps:

      - command: MoveChuckXY
        params:
          user: $user
          waferAgentName: $waferAgentName
          x: $rs.x
          y: $rs.y
          position: "Relative"
        when: "$rs.action == move"

      - command: Sleep
        params:
          user: $user
          waferAgentName: $waferAgentName
          seconds: $rs.settle
        when: "$rs.action == move"

      - command: TakeScreenshot
        params:
          user: $user
          waferAgentName: $waferAgentName
          fileName: $rs.filename
          outputDir: $flatfield_die
          wafer: $wafer
          snapshot_type: $snapshot_type
          save_locally: $save_locally
        when: "$rs.action == snapshot"

  # ── Build flatfield from the captured tiles ─────────────────────────
  # Samples all tiles, computes luminance median, smooths, normalises.
  # Output: Imaging/<wafer>/CALIBRATION_COLOR/flatfield.npy
  - command: BuildFlatfield
    params:
      user: $user
      waferAgentName: $waferAgentName
      folder: $flatfield_die
      wafer: $wafer
      sample_n: 25
      sigma: $flatfield_sigma
      output: $flatfield_output

  # ── Remove calibration tiles, keep only the flatfield model ─────────
  - command: CleanupRasterImages
    params:
      user: $user
      waferAgentName: $waferAgentName
      folder: $flatfield_die
      wafer: $wafer
