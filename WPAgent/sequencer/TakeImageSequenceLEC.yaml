# TakeImageSequenceLEC.yaml
params:
  user:
  waferAgentName:
  bams: ["BAM00","BAM01","BAM02","BAM03","BAM04","BAM05","BAM06","BAM07","BAM08","BAM09","BAM10","BAM11","BAM12","BAM13","BAM14","BAM15","BAM16","BAM17","BAM18","BAM19"]
  segs: ["SEG0","SEG1","SEG2","SEG3","SEG4"]
  num_columns: 1
  num_rows: 9
  column_spacing_um: -2968
  row_spacing_um: 2476
  start_x_um: -21088
  start_y_um: -27245
  settle_time_s: 1
  snapshot_type: "CameraRaw"
  save_locally: true
  # Output base folder: images go to  Imaging/<wafer>/<die>/
  # Override at runtime: --data='{"wafer":"Wafer25", ...}'
  wafer: "Wafer"
  bam_save_jpg: false
  seg_save_jpg: false
  bam_save_tif: true
  seg_save_tif: true
  name_suffix: "_LEC"
  tif_quality: 85

steps:

  - command: OpenProject
    params:
      projectName: ER2_babyMOSAIX_Vertical_V0_NotchW_ArrowW
      user: $user
      waferAgentName: $waferAgentName

  - command: InitProbing
    params:
      user: $user
      waferAgentName: $waferAgentName

  - foreach: $bams
    as: die
    steps:

      - command: MoveChuckRowColumn
        params:
          user: $user
          waferAgentName: $waferAgentName
          label: $die

      - command: GenerateRasterSteps
        as: raster
        params:
          user: $user
          waferAgentName: $waferAgentName
          num_columns: $num_columns
          num_rows: $num_rows
          column_spacing_um: $column_spacing_um
          row_spacing_um: $row_spacing_um
          start_x_um: $start_x_um
          start_y_um: $start_y_um

      - foreach: $raster.steps
        as: rs
        steps:

          - command: MoveChuckXY
            params:
              user: $user
              waferAgentName: $waferAgentName
              x: $rs.x
              y: $rs.y
              position: "Relative"
            when: "$rs.action == move"

          - command: Sleep
            params:
              user: $user
              waferAgentName: $waferAgentName
              seconds: $rs.settle
            when: "$rs.action == move"
            
          - command: TakeScreenshot
            params:
              user: $user
              waferAgentName: $waferAgentName
              fileName: $rs.filename
              outputDir: $die
              wafer: $wafer
              snapshot_type: $snapshot_type
              save_locally: $save_locally
            when: "$rs.action == snapshot"

      - command: StitchImagesFull
        params:
          user: $user
          waferAgentName: $waferAgentName
          folder: $die
          wafer: $wafer
          save_overview_jpg: $bam_save_jpg
          pyramid_tiff: $bam_save_tif
          tiff_quality: $tif_quality
          name_suffix: $name_suffix

      - command: CleanupRasterImages
        params:
          user: $user
          waferAgentName: $waferAgentName
          folder: $die
          wafer: $wafer

      - command: ArchiveImaging
        params:
        user: $user
        waferAgentName: $waferAgentName
        source_dir: "Imaging"
        dest_dir: "/eos/project/a/aliceits3/ITS3-WP3/MOSAIX/prober_imaging"


  - command: OpenProject
    params:
      projectName: ER2_MOSAIX_Vertical_V0_NotchW_ArrowW
      user: $user
      waferAgentName: $waferAgentName

  - foreach: $segs
    as: die
    steps:

      - command: MoveChuckRowColumn
        params:
          user: $user
          waferAgentName: $waferAgentName
          label: $die

      - command: GenerateRasterSteps
        as: raster
        params:
          user: $user
          waferAgentName: $waferAgentName
          num_columns: $num_columns
          num_rows: $num_rows
          column_spacing_um: $column_spacing_um
          row_spacing_um: $row_spacing_um
          start_x_um: $start_x_um
          start_y_um: $start_y_um

      - foreach: $raster.steps
        as: rs
        steps:

          - command: MoveChuckXY
            params:
              user: $user
              waferAgentName: $waferAgentName
              x: $rs.x
              y: $rs.y
              position: "Relative"
            when: "$rs.action == move"

          - command: Sleep
            params:
              user: $user
              waferAgentName: $waferAgentName
              seconds: $rs.settle
            when: "$rs.action == move"
            
          - command: TakeScreenshot
            params:
              user: $user
              waferAgentName: $waferAgentName
              fileName: $rs.filename
              outputDir: $die
              wafer: $wafer
              snapshot_type: $snapshot_type
              save_locally: $save_locally
            when: "$rs.action == snapshot"

      - command: StitchImagesFull
        params:
          user: $user
          waferAgentName: $waferAgentName
          folder: $die
          wafer: $wafer
          save_overview_jpg: $seg_save_jpg
          pyramid_tiff: $seg_save_tif
          tiff_quality: $tif_quality
          name_suffix: $name_suffix

      - command: CleanupRasterImages
        params:
          user: $user
          waferAgentName: $waferAgentName
          folder: $die
          wafer: $wafer

      - command: ArchiveImaging
        params:
        user: $user
        waferAgentName: $waferAgentName
        source_dir: "Imaging"
        dest_dir: "/eos/project/a/aliceits3/ITS3-WP3/MOSAIX/prober_imaging"