# TakeImageLECDie.yaml
#
# LEC imaging of ONE die: raster -> stitch -> cleanup -> archive.
# Same per-die steps as TakeImageLEC.yaml, without opening a project, so it can be
# run on its own or as a step of another sequence (e.g. NeedleOffsetMeasure_ER2B.yaml).
#
# Select the die with EITHER label OR col + row, and name its folder with `die`:
#   images go to Imaging/<wafer>/<die>/, then ArchiveImaging moves Imaging/ to archive_dir
#   (keeping <wafer>/<die>/).
#
# The raster parameters are those of TakeImageLEC.yaml (ER2 LEC column).
# CHECK start_x_um / start_y_um before using it on another chip layout (e.g. ER2B).

params:
  user:
  waferAgentName:
  # die selection: label OR col + row
  label: ""
  col:
  row:
  # folder name of the die: Imaging/<wafer>/<die>/
  die: "Test"
  wafer: "Wafer"
  # raster (as in TakeImageLEC.yaml)
  num_columns: 1
  num_rows: 9
  column_spacing_um: -2968
  row_spacing_um: 2476
  start_x_um: 29750
  start_y_um: -27500
  col_settle_time_s: 0.1
  row_settle_time_s: 0.1
  snapshot_type: "CameraRaw"
  save_locally: true
  # stitching
  save_jpg: false
  save_tif: true
  tif_quality: 85
  name_suffix: "_LEC"
  flatfield: ""          # auto-discovered from Imaging/<wafer>/CALIBRATION_COLOR/flatfield.npy
  flatfield_strength: 1.0
  # archive
  archive_dir: "/eos/project/a/aliceits3/ITS3-WP3/MOSAIX/prober_imaging"

steps:

  - command: MoveChuckRowColumn
    params:
      user: $user
      waferAgentName: $waferAgentName
      label: $label
      col: $col
      row: $row

  - command: GenerateRasterSteps
    as: raster
    params:
      user: $user
      waferAgentName: $waferAgentName
      wafer: $wafer
      num_columns: $num_columns
      num_rows: $num_rows
      column_spacing_um: $column_spacing_um
      row_spacing_um: $row_spacing_um
      start_x_um: $start_x_um
      start_y_um: $start_y_um
      col_settle_time_s: $col_settle_time_s
      row_settle_time_s: $row_settle_time_s
      y_col_correction_um: 0
      x_row_correction_um: 0

  - foreach: $raster.steps
    as: rs
    steps:

      - command: MoveChuckXYPrecise
        params:
          user: $user
          waferAgentName: $waferAgentName
          x: $rs.x
          y: $rs.y
          position: "Relative"
          precision_um: 0.15
          max_iterations: 100
          correction_settle_s: 0.1
        when: "$rs.action == move"

      - command: Sleep
        params:
          user: $user
          waferAgentName: $waferAgentName
          seconds: $rs.settle
        when: "$rs.action == move"

      - command: TakeScreenshot
        params:
          user: $user
          waferAgentName: $waferAgentName
          fileName: $rs.filename
          outputDir: $die
          wafer: $wafer
          snapshot_type: $snapshot_type
          save_locally: $save_locally
        when: "$rs.action == snapshot"

  - command: StitchImagesFull
    params:
      user: $user
      waferAgentName: $waferAgentName
      folder: $die
      wafer: $wafer
      save_overview_jpg: $save_jpg
      pyramid_tiff: $save_tif
      tiff_quality: $tif_quality
      name_suffix: $name_suffix
      flatfield: $flatfield
      flatfield_strength: $flatfield_strength

  - command: CleanupRasterImages
    params:
      user: $user
      waferAgentName: $waferAgentName
      folder: $die
      wafer: $wafer

  - command: ArchiveImaging
    params:
      user: $user
      waferAgentName: $waferAgentName
      source_dir: "Imaging"
      dest_dir: $archive_dir
