services:
  svt-db-agent-dev:
    container_name: svt-db-agent-dev
    depends_on:
      pg-db-dev:
        condition: service_healthy
      kafka:
        condition: service_healthy
    build:
      context: ./DB/svt-db-agent/
      dockerfile: ./Dockerfile
    environment:
      - "SVT_DB_AGENT_DB_PORT=5432"
      - "SVT_DB_AGENT_DB_HOST=pg-db-dev"
      - "SVT_DB_AGENT_DB_USER=postgres"
      - "SVT_DB_AGENT_DB_PASS=postgres"
      - "SVT_DB_AGENT_DB_NAME=postgres"
      - "SVT_DB_AGENT_LOGGER_FILE_PATH=/tmp/SvtDbAgent-dev"
      - "SVT_DB_AGENT_KAFKA_SERVER=kafka"
      - "SVT_DB_AGENT_KAFKA_PORT=9093"

  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: svt-zookeeper
    ports:
      - "2181:2181"
    expose:
      - "2181"

  kafka:
    image: wurstmeister/kafka:latest
    container_name: svt-kafka-broker
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    expose:
      - "9093"
    environment:
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9093,OUTSIDE://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9093,OUTSIDE://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_BROKER_ID: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  pg-db-dev:
    image: postgres:17.7
    restart: always
    container_name: pg-db-dev
    user: postgres
    environment:
      - "POSTGRES_PASSWORD=postgres"
      - "ES_JAVA_OPTS=-Xms1024m -Xmx3072m"
    ports:
      - "6600:5432"
    volumes:
      - pgData:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d postgres -U postgres"]
      interval: 1s
      timeout: 5s
      retries: 10

volumes:
  # docker volume create --name pgData -d local
  pgData:
    external: true
