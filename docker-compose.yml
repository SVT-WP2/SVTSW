services:
  svt-db-agent-dev:
    container_name: svt-db-agent-dev
    depends_on:
      - pg-db-dev
    build:
      context: ./DB/svt-db-agent/
      dockerfile: ./Dockerfile

  pg-db-dev:
    image: postgres:17.7
    restart: always
    container_name: pg-db-dev
    user: postgres
    environment:
      - "POSTGRES_PASSWORD=postgres"
      - "ES_JAVA_OPTS=-Xms1024m -Xmx3072m"
    ports:
      - "6600:5432"
    volumes:
      - pgData:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d postgres -U postgres"]
      interval: 1s
      timeout: 5s
      retries: 10

volumes:
  # docker volume create --name pgData -d local
  pgData:
    external: true
