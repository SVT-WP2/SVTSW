<div class="epic-toast-renderer">
    <div class="epic-toast-renderer__left">
        <epic-icon [name]="iconName"></epic-icon>
    </div>

    <div class="epic-toast-renderer__content">
        @if (title()) {
            <div class="epic-toast-renderer__title">
                {{ title() | translate }}
            </div>
        }

        @if (message()) {
            <div class="epic-toast-renderer__message">
                {{ message() | translate }}
            </div>
        }

        @if (actions?.length) {
            <div class="d-flex pt-2 gap-2 flex-wrap">
                @for (currentAction of actions; track currentAction) {
                    <button
                        [color]="currentAction.color"
                        [disabled]="!!currentAction.disabled"
                        [epicButtonStyle]="currentAction.buttonStyle || 'flat'"
                        epicButtonSize="small"
                        mat-button
                        (click)="handleActionClick(currentAction)"
                    >
                        @if (currentAction.icon) {
                            <epic-icon [name]="currentAction.icon" matButtonIcon> </epic-icon>
                        }
                        {{ currentAction.title | translate }}
                    </button>
                }
            </div>
        }
    </div>

    <div class="epic-toast-renderer__right">
        <button epicButtonSize="small" mat-icon-button (click)="handleCloseBtnClicked()">
            <epic-icon name="epic-close"></epic-icon>
        </button>
    </div>
</div>
