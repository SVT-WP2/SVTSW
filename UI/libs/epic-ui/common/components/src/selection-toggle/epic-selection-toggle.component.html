@if (showSelectAll) {
    <button [matTooltip]="'COMMON.SELECT_ALL' | translate"
            [disabled]="disabled"
            epicStrokedButton
            mat-icon-button
            (click)="onSelectAll()">
        <epic-icon matButtonIcon name="done_all"/>
    </button>
} @else {
    <button [matTooltip]="'COMMON.CLEAR_SELECTION' | translate"
            [disabled]="disabled"
            epicStrokedButton
            mat-icon-button
            (click)="onClear()">
        <epic-icon matButtonIcon name="epic-clean-filter"/>
    </button>
}
