<div class="epic-label">
    <!-- ICON -->
    <ng-content select="epic-icon:not([epicLabelAction])"></ng-content>
    @if (iconName?.length) {
        <epic-icon [name]="iconName!"></epic-icon>
    }
    <!-- ./ICON -->

    <!-- CONTENT -->
    <div class="epic-label__content">
        <ng-content></ng-content>
    </div>
    <!-- ./CONTENT -->

    <!-- ACTIONS -->
    <ng-content select="[epicLabelAction]"></ng-content>
    <!-- ./ACTIONS -->
</div>
