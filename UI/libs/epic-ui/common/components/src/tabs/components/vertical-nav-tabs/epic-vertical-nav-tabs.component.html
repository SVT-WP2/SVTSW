<epic-mat-menu-content>
    @for (tabInfo of decoratedTabs; track tabInfo) {
        <a
            [disabled]="tabInfo?.disabled"
            [queryParams]="tabInfo?.routerQueryParams"
            [routerLink]="tabInfo.routerLink"
            [routerLinkActiveOptions]="tabInfo?.routerLinkActiveOptions"
            routerLinkActive="active"
            mat-menu-item
        >
            <!-- ICON -->
            @if (tabInfo?.icon) {
                <epic-icon [name]="tabInfo.icon" matMenuItemIcon> </epic-icon>
            }
            <!-- ./ICON -->
            <!-- CONTENT -->
            <ng-container
                *ngTemplateOutlet="tabContentTemplate?.templateRef || defaultContentTemplate; context: { tabInfo: tabInfo }"
            ></ng-container>
            <!-- ./CONTENT -->
        </a>
    }
</epic-mat-menu-content>

<ng-template #defaultContentTemplate let-tabInfo="tabInfo">
    {{ tabInfo.label | translate }}
</ng-template>
