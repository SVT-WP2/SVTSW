<div class="loader--wrapper"
     [class.fill-all-section]="fillAllSection"
     [class.transparent-bg]="(fillAllSection && isTransparentBackground)">

    <!-- LOADER -->
    <div class="loader pls-blue" [ngStyle]="{width: loaderRadius + 'px'}">
        <svg class="pl-circular" viewBox="25 25 50 50">
            <circle class="plc-path" cx="50" cy="50" r="20" [ngStyle]="{'stroke': color}"></circle>
        </svg>
    </div>
    <!-- ./LOADER -->

    <!-- TEXT -->
    @if (showLoadingText) {
        <div class="loader__text">
            {{ loadingText ? loadingText : 'COMMON.LOADING' | translate }}
        </div>
    }
    <!-- ./TEXT -->

</div>
