@if (data?.headerTitle) {
    <epic-mat-dialog-header [headerIconName]="data?.headerIconName">
        {{ data?.headerTitle | translate }}
    </epic-mat-dialog-header>
}

<mat-dialog-content>
    @if (!!data?.messageTemplateRef) {
        <ng-container *ngTemplateOutlet="data.messageTemplateRef"></ng-container>
    }

    @if (!data?.messageTemplateRef) {
        <div [innerHTML]="(data?.message ? data.message : defaultMessage) | translate | epicSafeHtml"></div>
    }
</mat-dialog-content>

<mat-dialog-actions align="end">
    @if (!data?.hideCancelButton) {
        <button [disabled]="isProcessing" mat-stroked-button (click)="onCancelButtonClicked()">
            {{ "COMMON.CANCEL" | translate }}
        </button>
    }

    <button
        [color]="data?.confirmButtonColor ?? defaultConfirmBtnStyles"
        [disabled]="isProcessing"
        mat-flat-button
        (click)="onConfirmButtonClicked()"
    >
        {{ (isProcessing ? "COMMON.PROCESSING" : data?.confirmButtonText ? data.confirmButtonText : defaultConfirmButtonText) | translate }}
    </button>
</mat-dialog-actions>
