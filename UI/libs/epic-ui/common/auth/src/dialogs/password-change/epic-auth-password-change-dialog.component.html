<epic-mat-dialog-header>
    Change password
</epic-mat-dialog-header>

<mat-dialog-content>

    @if (processingError?.length) {
        <epic-alert severity="error" class="mb-3 d-block">
            <epic-icon name="epic-info"/>
            {{ processingError }}
        </epic-alert>
    }

    <epic-auth-password-change-form (formGroupReady$)="onFormGroupReady($event)"/>

</mat-dialog-content>

<mat-dialog-actions align="end">
    <button [disabled]="isProcessing" mat-dialog-close mat-stroked-button>
        Cancel
    </button>

    <button [disabled]="!formGroup?.valid || isProcessing"
            color="primary"
            mat-flat-button
            (click)="formGroup && onSubmitBtnClicked(formGroup)">
        {{ isProcessing ? 'Processing ...' : 'Change password' }}
    </button>
</mat-dialog-actions>
