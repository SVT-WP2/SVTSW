<div class="d-flex gap-3 flex-column" [formGroup]="formGroup">
    <mat-form-field class="w-100">
        <mat-label>Current password</mat-label>
        <input [formControlName]="FormField.currentPassword" matInput autocomplete="current-password"
               [type]="isPasswordVisible ? 'text' : 'password'">
        <mat-error>{{ getErrorText(formGroup.controls[FormField.currentPassword]) }}</mat-error>
        <div matSuffix>
            <button type="button" mat-icon-button class="me-2" (click)="isPasswordVisible = !isPasswordVisible">
                <epic-icon [name]="isPasswordVisible ? 'epic-eye-close' : 'epic-eye-open'"/>
            </button>
        </div>
    </mat-form-field>

    <mat-form-field class="w-100">
        <mat-label>New password</mat-label>
        <input [formControlName]="FormField.newPassword" matInput autocomplete="new-password"
               [type]="isPasswordVisible ? 'text' : 'password'">
        <mat-hint>8 to 128 characters</mat-hint>
        <mat-error>{{ getErrorText(formGroup.controls[FormField.newPassword]) }}</mat-error>
    </mat-form-field>

    <mat-form-field class="w-100">
        <mat-label>Repeat the new password</mat-label>
        <input [formControlName]="FormField.repeatPassword" matInput autocomplete="new-password"
               [type]="isPasswordVisible ? 'text' : 'password'">
        <mat-error>{{ getErrorText(formGroup.controls[FormField.repeatPassword]) }}</mat-error>
    </mat-form-field>
</div>
