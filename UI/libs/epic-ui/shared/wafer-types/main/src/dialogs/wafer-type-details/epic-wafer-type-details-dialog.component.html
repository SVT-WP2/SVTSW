<epic-mat-dialog-header>
    <div class="d-flex align-items-center gap-3">
        Wafer Type Details
    </div>
</epic-mat-dialog-header>

<epic-mat-dialog-content>
    <div class="e2e-container flex-row">
        <div style="width: 320px" class="epic-border-style-right--solid overflow-auto">
            <epic-wafer-type-info [entity]="dialogData.waferType" />
        </div>
        <div class="e2e-container__body epic-bg-color-neutral-20 text-center p-3">
            <div class="epic-border-radius--500 epic-bg-color-neutral-0 p-5 text-center mw-100 mh-100 overflow-hidden w-100 h-100 d-flex align-items-center justify-content-center">
                <img src="/assets/images/epic-shared.wafer-types/wafer-image-1.png" class="d-inline-block mw-100 mh-100" />
            </div>
        </div>
    </div>
</epic-mat-dialog-content>
