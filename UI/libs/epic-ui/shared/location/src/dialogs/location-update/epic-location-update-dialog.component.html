<epic-mat-dialog-header>
    {{ dialogData.dialogTitle }}
</epic-mat-dialog-header>

<mat-dialog-content>

    @if (processingError?.length) {
        <epic-alert severity="error" class="mb-3 d-block">
            <epic-icon name="epic-info" />
            {{ processingError }}
        </epic-alert>
    }

    <epic-location-update-form
            [formData]="dialogData.formData"
            [formOptions]="dialogData.formOptions"
            (formGroupReady$)="onFormGroupReady($event)"
    />

</mat-dialog-content>

<mat-dialog-actions align="end">
    <button [disabled]="isProcessing"
            mat-dialog-close
            mat-stroked-button>
        {{ 'COMMON.CANCEL' | translate }}
    </button>

    <button [disabled]="!formGroup?.valid || isProcessing"
            color="primary"
            mat-flat-button
            tabindex="-1"
            (click)="onSubmitBtnClicked(formGroup)">
        @if (!isProcessing) {
            {{ (dialogData.submitBtnText ?? 'COMMON.SAVE') | translate }}
        } @else {
            {{ 'COMMON.PROCESSING' | translate }}
        }
    </button>
</mat-dialog-actions>
