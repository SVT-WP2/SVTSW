<epic-mat-dialog-header>
    Set password
</epic-mat-dialog-header>

<mat-dialog-content>

    <p class="mb-3">
        The new password of <strong>{{ dialogData.user.name }}</strong> ({{ dialogData.user.login }}). The current
        password is not needed.
    </p>

    @if (processingError?.length) {
        <epic-alert severity="error" class="mb-3 d-block">
            <epic-icon name="epic-info"/>
            {{ processingError }}
        </epic-alert>
    }

    <epic-user-password-form (formGroupReady$)="onFormGroupReady($event)"/>

</mat-dialog-content>

<mat-dialog-actions align="end">
    <button [disabled]="isProcessing" mat-dialog-close mat-stroked-button>
        Cancel
    </button>

    <button [disabled]="!formGroup?.valid || isProcessing"
            color="primary"
            mat-flat-button
            (click)="formGroup && onSubmitBtnClicked(formGroup)">
        {{ isProcessing ? 'Processing ...' : 'Set password' }}
    </button>
</mat-dialog-actions>
