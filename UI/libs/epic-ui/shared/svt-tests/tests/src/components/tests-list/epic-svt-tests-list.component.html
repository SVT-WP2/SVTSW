<ag-grid-angular
        class="ag-theme-alpine h-100"
        [columnDefs]="colDefs"
        [gridOptions]="gridOptions"
        [datasource]="datasource"
        epicAgGridCellEvent
        (cellEvent$)="onCellEvent($event)"
        (gridReady)="onGridReady($event)"
        (modelUpdated)="onModelUpdated()"
        (rowClicked)="onRowClicked($event.data)"/>
