<div class="e2e-container">
    @if (dataFetchingProcessing()?.processing) {
        <epic-loader [fillAllSection]="true"/>
    } @else if (dataFetchingProcessing()?.processingError) {
        <epic-content-error>
            {{ dataFetchingProcessing()?.processingError | epicContentErrorMessage }}
        </epic-content-error>
    } @else {
        <!-- FILTER -->
        <div class="d-flex align-items-center gap-2 py-2 px-3 epic-bg-color-neutral-0 epic-border-style-bottom--solid">
            <div class="flex-1 overflow-x-auto" style="min-width: 0">
                <epic-svt-tests-list-filter [(filterValue)]="headerFilterValue"
                                            [filterData]="filterData()"
                                            [showDutEntityNameFilter]="false"/>
            </div>
        </div>
        <!-- ./FILTER -->

                <!-- STATISTICS -->
                <!-- only once the first list is in: a strip of zeros over a list that is still loading says nothing -->
        @if (entitiesList()) {
            <div class="p-3 pb-0">
                <epic-svt-dut-tests-stats [stats]="stats()" [totalStats]="totalStats()"/>
            </div>
        }
        <!-- ./STATISTICS -->

        <!-- LIST -->
        <div class="e2e-container__body p-3">

            <epic-svt-dut-tests-list class="d-flex h-100 w-100"
                                     [entitiesList]="filteredEntitiesList()"/>
        </div>
        <!-- ./LIST -->
    }
</div>
