<epic-mat-dialog-header>
    Equipment Type - {{ !isUpdate ? 'Create' : 'Update' }}
</epic-mat-dialog-header>

<mat-dialog-content>

    @if (processingError?.length) {
        <epic-alert severity="error" class="mb-3 d-block">
            <epic-icon name="epic-info"/>
            {{ processingError }}
        </epic-alert>
    }

    <epic-equipment-type-update-form #form
                                 [formData]="dialogData.formData"
                                 (formGroupReady$)="onFormGroupReady($event)"/>

</mat-dialog-content>

<mat-dialog-actions align="end">
    <button [disabled]="isProcessing"
            mat-dialog-close
            mat-stroked-button>
        {{ 'COMMON.CANCEL' | translate }}
    </button>

    <button [disabled]="!formGroup?.valid || isProcessing"
            color="primary"
            mat-flat-button
            tabindex="-1"
            (click)="onSubmitBtnClicked(formGroup)">
        @if (!isProcessing) {
            {{ (!isUpdate ? 'COMMON.CREATE' : 'COMMON.SAVE') | translate }}
        } @else {
            {{ 'COMMON.PROCESSING' | translate }}
        }
    </button>
</mat-dialog-actions>
