<epic-layout-light-header-title>
    Wafer Probe Machines
</epic-layout-light-header-title>

<epic-layout-light-header-actions>
    <button [matTooltip]="'Refresh'" epicStrokedButton mat-icon-button (click)="onReload()">
        <epic-icon [name]="'epic-refresh'" matButtonIcon/>
    </button>
</epic-layout-light-header-actions>

<div class="e2e-container h-100 d-flex w-100">
    <div class="e2e-container__body p-3">
        @if (dataFetchingProcessing().processing) {
            <epic-loader [fillAllSection]="true"/>
        } @else if (dataFetchingProcessing().processingError) {
            <epic-content-error>
                {{ dataFetchingProcessing().processingError | epicContentErrorMessage }}
            </epic-content-error>
        } @else {
            <div class="container">
                @for(entity of entitiesList(); track entity.id) {
                    <epic-wp-machine-card [entity]="entity"
                                          (installedProbeCardChanged$)="onInstalledProbeCardChanged(entity.id, $event)"
                                          (loadedWaferChanged$)="onLoadedWaferChanged(entity.id, $event)"
                                          class="mb-3" />
                }
            </div>
        }
    </div>
</div>
