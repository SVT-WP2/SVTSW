<epic-layout-light-header-title>
    Wafer Tests
</epic-layout-light-header-title>

<epic-layout-light-header-actions>
    <button [matTooltip]="'Refresh'" epicStrokedButton mat-icon-button (click)="onReload()">
        <epic-icon [name]="'epic-refresh'" matButtonIcon/>
    </button>
</epic-layout-light-header-actions>

<epic-layout-light-header-actions>
    <button color="primary" mat-flat-button (click)="onCreate()">
        <epic-icon [name]="'add'" matButtonIcon/>
        Create New
    </button>
</epic-layout-light-header-actions>

<div class="h-100 d-flex w-100">
    @if (dataFetchingProcessing().processing) {
        <epic-loader [fillAllSection]="true"/>
    } @else if (dataFetchingProcessing().processingError) {
        <epic-content-error>
            {{ dataFetchingProcessing().processingError | epicContentErrorMessage }}
        </epic-content-error>
    } @else {
        <epic-wafer-tests-list class="d-flex h-100 w-100"
                               [entitiesList]="entitiesList()"
                               (details$)="onRowDetails($event)"
                               (rowClicked$)="onRowClicked($event)"
                               (clone$)="onRowClone($event)"/>
    }
</div>
