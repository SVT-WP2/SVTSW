<epic-layout-light-header-title>
    SVT Tests
</epic-layout-light-header-title>

<epic-layout-light-header-actions>
    <button [matTooltip]="'Refresh'" epicStrokedButton mat-icon-button (click)="onReload()">
        <epic-icon [name]="'epic-refresh'" matButtonIcon/>
    </button>
</epic-layout-light-header-actions>

<epic-layout-light-header-actions>
    <button color="primary" mat-flat-button (click)="onCreate()">
        <epic-icon [name]="'add'" matButtonIcon/>
        Create New
    </button>
</epic-layout-light-header-actions>

<div class="e2e-container">
    <div class="epic-border-style-bottom--solid epic-bg-color-neutral-0 px-3 py-2 overflow-x-auto">
        <epic-svt-tests-list-filter [(filterValue)]="headerFilterValue" [filterData]="filterData()"/>
    </div>
    <div class="e2e-container__body p-3">
        @if (dataFetchingProcessing()?.processingError) {
            <epic-content-error>
                {{ dataFetchingProcessing()?.processingError | epicContentErrorMessage }}
            </epic-content-error>
        } @else {
            <!-- no loader in front of the grid: it loads its own blocks and renders loading rows while it waits -->
            <epic-svt-tests-list
                    class="d-flex h-100 w-100"
                    [datasource]="datasource()"
                    (rowClicked$)="onRowClicked($event)" />
        }
    </div>
</div>
