<div class="container">
    <mat-card>
        <mat-card-header>
            <div class="d-flex align-items-center justify-content-between w-100">
                <mat-card-title>Create Chip With File</mat-card-title>
                <button color="primary" mat-flat-button (click)="onCreate()">
                    Open Dialog
                </button>
            </div>

        </mat-card-header>
        <mat-card-content class="py-3">
            <div class="row">
                <div class="col-lg-6">
                    <epic-chip-create-with-file-form (dataChanged$)="formData.set($event)"/>
                </div>
                <div class="col-lg-6">
                    <markdown [data]="data()" lineNumbers ngPreserveWhitespaces></markdown>
                </div>
            </div>
        </mat-card-content>
    </mat-card>

    <mat-card class="mt-3">
        <mat-card-header>
            <div class="d-flex align-items-center justify-content-between w-100">
                <mat-card-title>Create Many Preview Grid</mat-card-title>
                <button color="primary" mat-flat-button (click)="onCreateManyPreview()">
                    Open Dialog
                </button>
            </div>

        </mat-card-header>
        <mat-card-content class="py-3">
            <epic-chip-create-many-preview-grid [entities]="createManyData()"/>
        </mat-card-content>
    </mat-card>
</div>
