<epic-layout-light-header-title>
    <div class="d-flex align-items-center">
        <epic-breadcrumbs [breadcrumbs]="breadcrumbs()" [size]="'large'"/>
    </div>
</epic-layout-light-header-title>

@if (asicFetchOneProcessing().processing) {
    <epic-loader [fillAllSection]="true"/>
} @else if (asicFetchOneProcessing().processingError) {
    <epic-content-error>
        {{ asicFetchOneProcessing().processingError | epicContentErrorMessage }}
    </epic-content-error>
} @else {
    <div class="h-100 d-flex w-100">
        <div class="e2e-container flex-row">
            <div style="width: 320px" class="epic-bg-color-neutral-0 overflow-auto epic-border-style-right--solid position-relative pb-5">
                <div>
                    @if (asic()) {
                        <div class="d-flex justify-content-between align-items-center p-3 pb-0">
                            <div class="epic-font-title">
                                {{ asic()?.serialNumber }}
                            </div>

                            @if (!asic().chipId) {
                                <button [matMenuTriggerFor]="menu" epicStrokedButton mat-icon-button>
                                    <epic-icon name="more_vert"/>
                                </button>
                                <mat-menu #menu="matMenu">
                                    <button mat-menu-item (click)="onCreateChip()">
                                        <epic-icon [name]="'memory' | epicIconMatOutlined" matMenuItemIcon/>
                                        Create Chip
                                    </button>
                                </mat-menu>
                            }
                        </div>
                        <epic-asic-info [asic]="asic()"/>
                    }

                    <!-- CHIP INFO -->
                    @if (chip()) {
                        <mat-divider/>
                        <div class="d-flex w-100 justify-content-between align-items-center p-3 pb-0">
                            <div class="epic-font-label epic-color-neutral-90">
                                Chip Details
                            </div>
                            <button [matMenuTriggerFor]="menu" epicStrokedButton mat-icon-button>
                                <epic-icon name="more_vert"/>
                            </button>
                            <mat-menu #menu="matMenu">
                                <button mat-menu-item (click)="onOpenLocationHistory()">
                                    <epic-icon [name]="'history'" matMenuItemIcon/>
                                    Location History
                                </button>
                                <mat-divider/>
                                <button mat-menu-item (click)="onUpdateLocation()">
                                    <epic-icon [name]="'location_on' | epicIconMatOutlined" matMenuItemIcon/>
                                    Update Location
                                </button>
                            </mat-menu>
                        </div>

                        <epic-chip-info [chip]="chip()"/>
                    }
                    <!-- ./CHIP INFO -->

                    <mat-divider/>

                    <div class="px-3">
                        <epic-mat-menu-content>
                            <epic-vertical-nav-tabs [tabs]="navTabs"/>
                        </epic-mat-menu-content>
                    </div>

                </div>
                <div class="position-absolute bottom-0 epic-bg-color-neutral-0 w-100">
                    <mat-divider/>
                    <div class="p-2 px-3">
                        <button mat-stroked-button class="w-100">
                            <epic-icon name="map" matButtonIcon matIconPrefix/>
                            Wafer Map
                        </button>
                    </div>
                </div>
            </div>

            <div class="e2e-container__body-with-scroll p-3">
                <router-outlet/>
            </div>
        </div>
    </div>
}
