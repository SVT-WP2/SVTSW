<div class="p-3">
    <epic-ag-grid-card-wrapper>
        <epic-ag-grid-card-header>
            <div class="epic-font-title-lg">Voltage Scan [POC]</div>
            <div class="d-flex gap-3 align-items-center">
                <button mat-icon-button epicStrokedButton [matTooltip]="'Refresh'" (click)="onAsicIvMntReload()">
                    <epic-icon name="epic-refresh"/>
                </button>
                <mat-divider [vertical]="true"/>
                <button mat-flat-button color="primary" (click)="openDialog()">
                    <epic-icon name="add" matButtonIcon matIconPrefix/>
                    New
                </button>
            </div>
        </epic-ag-grid-card-header>
        <epic-asic-iv-mnt-grid [entities]="asicIvMntsList"
                               (repeat$)="onRowRepeat($event)"
                               (delete$)="onRowDelete($event)"
                               (details$)="onRowDetails($event)"
                               (rowClicked$)="onRowClicked($event)"/>
    </epic-ag-grid-card-wrapper>
</div>
