# Kafka stack (KRaft broker + Kafka UI) - DEV environment.
#
# Deployed to /opt/docker/svtsw/dev/ on the server. Optional overrides come from
# the two env files next to it (all defaults below already match this
# environment, so the stack also runs with empty env files):
#
#   .env          - KAFKA_ADVERTISED_HOST, host ports, cluster id
#   versions.env  - KAFKA_VERSION, KAFKA_UI_VERSION image pins
#
# Manual usage (from /opt/docker/svtsw/dev):
#   docker compose -p svt-kafka--dev --env-file .env --env-file versions.env \
#     -f docker-compose-kafka-dev.yml up -d
#
# This stack OWNS the svt-network--dev network; the application stack
# (docker-compose-svtsw-dev.yml) joins it as external - start Kafka first.

# Pin the Compose project name so Dev and Prod stay isolated on a shared host
# (without it, --remove-orphans from one stack would delete the other's
# containers when both run from the same directory name).
name: svt-kafka--dev

services:
  kafka:
    image: confluentinc/cp-kafka:${KAFKA_VERSION:-7.4.0}
    container_name: svt.kafka-broker--dev
    restart: unless-stopped
    # Host-side ports are overridable; the container-side listener ports are
    # fixed (they are baked into KAFKA_LISTENERS below).
    ports:
      - "${KAFKA_PORT_INSIDE:-9094}:9094"   # INSIDE (inter-container)
      - "${KAFKA_PORT_TUNNEL:-9095}:9095"   # TUNNEL (ssh)
      - "${KAFKA_PORT_OUTSIDE:-9096}:9096"  # OUTSIDE (external network)
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      - svt-network--dev
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9094,TUNNEL://0.0.0.0:9095,OUTSIDE://0.0.0.0:9096,CONTROLLER://0.0.0.0:9093
      # TUNNEL/OUTSIDE advertise the HOST-side ports; OUTSIDE advertises the
      # public address of this host (override KAFKA_ADVERTISED_HOST in .env).
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9094,TUNNEL://localhost:${KAFKA_PORT_TUNNEL:-9095},OUTSIDE://${KAFKA_ADVERTISED_HOST:-128.141.22.7}:${KAFKA_PORT_OUTSIDE:-9096}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,TUNNEL:PLAINTEXT,OUTSIDE:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # --- Large payloads (50 MiB) ------------------------------------------
      # Kafka's default cap is 1 MB, which list replies (wafers, chips, ...)
      # blow past. message.max.bytes is the broker-wide default for a topic's
      # max.message.bytes; replica.fetch.max.bytes must be >= it or replication
      # stalls silently. The two ceilings below just need headroom.
      # Keep in sync with Prod and with Dev/docker-compose.kafka-local.yml.
      KAFKA_MESSAGE_MAX_BYTES: 52428800
      KAFKA_REPLICA_FETCH_MAX_BYTES: 52428800
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 209715200
      KAFKA_FETCH_MAX_BYTES: 209715200
      KAFKA_HEAP_OPTS: "-Xmx1g -Xms512m"
      KAFKA_LOG4J_LOGGERS: "kafka.controller=INFO,kafka.producer.async.DefaultEventHandler=INFO,state.change.logger=INFO"
      KAFKA_LOG4J_ROOT_LOGLEVEL: "INFO"
      KAFKA_TOOLS_LOG4J_LOGLEVEL: "INFO"
      # Fixed cluster ID for KRaft mode - must stay stable for the lifetime of
      # the data volume, and must differ between dev and prod.
      CLUSTER_ID: "${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}"
    volumes:
      - kafka-data:/var/lib/kafka/data
      - kafka-logs:/var/log/kafka
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9094", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:${KAFKA_UI_VERSION:-latest}
    container_name: svt.kafka-ui--dev
    depends_on:
      - kafka
    ports:
      - "${KAFKA_UI_PORT:-8087}:8080"
    restart: unless-stopped
    networks:
      - svt-network--dev
    environment:
      - KAFKA_CLUSTERS_0_NAME=dev
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9094

volumes:
  kafka-data:
    name: svt-kafka-data--dev
  kafka-logs:
    name: svt-kafka-logs--dev

networks:
  svt-network--dev:
    name: svt-network--dev
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1500
