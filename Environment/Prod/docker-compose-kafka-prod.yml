services:
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: svt.kafka-broker--prod
    restart: unless-stopped
    ports:
      - "9090:9094"  # INSIDE (inter-container)
      - "9091:9095"  # TUNNEL (ssh)
      - "9092:9096"  # OUTSIDE (external network) - public port
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      - svt-network--prod
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9094,TUNNEL://0.0.0.0:9095,OUTSIDE://0.0.0.0:9096,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9094,TUNNEL://localhost:9091,OUTSIDE://128.141.22.7:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,TUNNEL:PLAINTEXT,OUTSIDE:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # --- Large payloads (50 MiB) ------------------------------------------
      # Kafka's default cap is 1 MB, which list replies (wafers, chips, ...)
      # blow past. message.max.bytes is the broker-wide default for a topic's
      # max.message.bytes; replica.fetch.max.bytes must be >= it or replication
      # stalls silently. The two ceilings below just need headroom.
      # Keep in sync with Dev and with Dev/docker-compose.kafka-local.yml.
      KAFKA_MESSAGE_MAX_BYTES: 52428800
      KAFKA_REPLICA_FETCH_MAX_BYTES: 52428800
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 209715200
      KAFKA_FETCH_MAX_BYTES: 209715200
      KAFKA_HEAP_OPTS: "-Xmx1g -Xms512m"
      KAFKA_LOG4J_LOGGERS: "kafka.controller=INFO,kafka.producer.async.DefaultEventHandler=INFO,state.change.logger=INFO"
      KAFKA_LOG4J_ROOT_LOGLEVEL: "INFO"
      KAFKA_TOOLS_LOG4J_LOGLEVEL: "INFO"
      CLUSTER_ID: "UHJvZEthZmthQ2x1c3RyMQ"  # fixed cluster ID for KRaft mode (must differ from dev)
    volumes:
      - kafka-data:/var/lib/kafka/data
      - kafka-logs:/var/log/kafka
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9094", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: svt.kafka-ui--prod
    depends_on:
      - kafka
    ports:
      - "8088:8080"
    restart: unless-stopped
    networks:
      - svt-network--prod
    environment:
      - KAFKA_CLUSTERS_0_NAME=prod
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9094

volumes:
  kafka-data:
    name: svt-kafka-data--prod
  kafka-logs:
    name: svt-kafka-logs--prod

networks:
  svt-network--prod:
    name: svt-network--prod
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1500
