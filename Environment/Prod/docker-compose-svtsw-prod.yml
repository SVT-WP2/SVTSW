# SVTSW application stack - PROD environment.
#
# Lives in git at Environment/Prod/, deployed to /opt/docker/svtsw/prod/ on the
# server (every CI deploy re-syncs the server copy). Everything environment-
# specific comes from two env files that sit NEXT to this file on the server
# and are NOT in git:
#
#   .env          - config + secrets (DB credentials, hosts, ports).
#                   Admin-managed; template: .env.example
#   versions.env  - the image tag of every service in this environment.
#                   CI-managed (one line rewritten per deploy);
#                   template: versions.env.example
#
# Manual usage (from /opt/docker/svtsw/prod):
#   docker compose -p svt-svtsw--prod --env-file .env --env-file versions.env \
#     -f docker-compose-svtsw-prod.yml up -d
#
# Normally you don't run this by hand: the svt.svtsw--prod systemd unit brings
# the stack up on boot, and CI deploys recreate single services inside the
# same compose project (see ../deploy-service.sh).
#
# Interpolation conventions:
#   ${VAR:?message} - required: compose aborts with `message` when unset/empty
#   ${VAR:-default} - optional, default matches this environment

# Pin the Compose project name: CI deploys, the systemd unit and manual runs
# must all address the same project, or they would manage separate stacks.
name: svt-svtsw--prod

services:
  svt-ui:
    image: ghcr.io/svt-wp2/svt-ui:${SVT_UI_VERSION:?missing - set it in versions.env}
    container_name: svt.ui--prod
    restart: unless-stopped
    networks:
      - svt-network--prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SVT_UI_PORT:-80}:${SVT_UI_PORT:-80}"
    environment:
      SVT_UI_PORT: "${SVT_UI_PORT:-80}"
      KAFKA_BROKER: "${SVT_KAFKA_HOST:-kafka}:${SVT_KAFKA_PORT:-9094}"
      # The UI reports its own version; keep it in lockstep with the image tag.
      APP_VERSION: "${SVT_UI_VERSION}"
      NODE_ENV: production
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # The DB agent of this environment is svt-db-agent-next, the NestJS
  # re-implementation built from DbAgentNext/. Same SVT_DB_AGENT_* variables as
  # the C++ svt-db-agent that it replaced, no log volume (it logs to stdout),
  # and GET /health on port 7676 inside the network (not published; the image's
  # HEALTHCHECK probes it).
  svt-db-agent-next:
    image: ghcr.io/svt-wp2/svt-db-agent-next:${SVT_DB_AGENT_NEXT_VERSION:?missing - set it in versions.env}
    container_name: svt.db-agent-next--prod
    restart: unless-stopped
    networks:
      - svt-network--prod
    # Lets SVT_DB_HOST=host.docker.internal reach a native Postgres on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SVT_DB_AGENT_DB_HOST: "${SVT_DB_HOST:?missing - set it in .env}"
      SVT_DB_AGENT_DB_PORT: "${SVT_DB_PORT:-5432}"
      SVT_DB_AGENT_DB_USER: "${SVT_DB_USER:?missing - set it in .env}"
      SVT_DB_AGENT_DB_PASS: "${SVT_DB_PASS:?missing - set it in .env}"
      SVT_DB_AGENT_DB_NAME: "${SVT_DB_NAME:?missing - set it in .env}"
      SVT_DB_AGENT_DB_SCHEMA: "${SVT_DB_SCHEMA:?missing - set it in .env}"
      SVT_DB_AGENT_KAFKA_SERVER: "${SVT_KAFKA_HOST:-kafka}"
      SVT_DB_AGENT_KAFKA_PORT: "${SVT_KAFKA_PORT:-9094}"
      # PRODUCTION | STANDARD | VERBOSE | DEBUG, mapped onto Nest log levels.
      SVT_DB_AGENT_LOGGER_TERM_VERBOSITY: "${SVT_DB_AGENT_NEXT_LOG_VERBOSITY:-STANDARD}"
      # true | false: write a new chip's ChipBlock rows from AsicFamilyTypeBlockList (naming unconfirmed, off by default).
      SVT_DB_AGENT_FEATURE_CHIP_BLOCKS: "${SVT_DB_AGENT_NEXT_FEATURE_CHIP_BLOCKS:-false}"
      # The agent reports its own version; keep it in lockstep with the image tag.
      APP_VERSION: "${SVT_DB_AGENT_NEXT_VERSION}"
      NODE_ENV: production
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # WPAgent: one service per WP machine, as in docker-compose-svtsw-dev.yml.
  # TEMPORARY: off on prod until the first WPAgent release (svt-wp-agent-* tag): before it
  # there is no release image, and a missing image or version line stops the whole stack.
  # To enable: uncomment the block, the SVT_WP_AGENT_WPMIT_VERSION line in
  # versions.env.example and the deploy-prod--manual option of wp-agent-manual.yml. Change
  # the WPMIT record in the DB first (its hostName: Environment/README.md, "Switching WPMIT
  # from the old agent").
  # svt-wp-agent-wpmit:
  #   image: ghcr.io/svt-wp2/svt-wp-agent:${SVT_WP_AGENT_WPMIT_VERSION:?missing - set it in versions.env}
  #   container_name: svt.wp-agent-wpmit--prod
  #   restart: unless-stopped
  #   # On a stop or a redeploy the agent lets the running command finish (up to 20 s,
  #   # STOP_COMMAND_WAIT in WPAgent/WPKafkaClient.py), then closes its connection to the
  #   # WP machine. Keep this above that wait: after it docker kills the container.
  #   stop_grace_period: 30s
  #   networks:
  #     - svt-network--prod
  #   command: ["listen"]
  #   environment:
  #     SVT_WP_AGENT_MACHINE_NAME: WPMIT
  #     SVT_WP_AGENT_KAFKA_BROKER: "${SVT_KAFKA_HOST:-kafka}:${SVT_KAFKA_PORT:-9094}"
  #     # The agent reports its own version; keep it in lockstep with the image tag.
  #     APP_VERSION: "${SVT_WP_AGENT_WPMIT_VERSION}"
  #   logging:
  #     driver: "json-file"
  #     options:
  #       max-size: "50m"
  #       max-file: "5"

# The network is created and owned by the Kafka stack
# (docker-compose-kafka-prod.yml) - start that stack first.
networks:
  svt-network--prod:
    external: true
    name: svt-network--prod
