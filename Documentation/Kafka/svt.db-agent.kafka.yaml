openapi: "3.0.1"
info:
  title: SVT DB Agent (C++, frozen)
  description: |
    The Kafka communication layer of the C++ `SVT DB Agent Service` (`DbAgent/`, image `svt-db-agent`).

    ### Status: frozen
    - The C++ agent is frozen since 2026-11-15: its code does not change. Development continues in the NestJS
      re-implementation `svt-db-agent-next` (`DbAgentNext/`). The contract of that agent is
      `svt.db-agent-next.kafka.yaml`. Use that file, not this one, for the system under development. The
      decision, and the way back to the C++, are in `Documentation/decisions/2026-11-db-agent-clone.md`.
    - This file says what the frozen C++ code does, defects included. It changes only to correct a statement
      that does not agree with that code.
    - Before 2026-11-18 this file described the intended behaviour, and the code did something else in many
      places. `DbAgent/docs/07-contract-drift-and-quirks.md` keeps what this file said then, with an id for each
      difference: `D-…` (request shape), `R-…` (reply shape), `X-…` (behaviour). Those ids are quoted below.
    - The statements were checked against the code and against the replies of the C++ agent recorded on
      2026-11-14 (`DbAgentNext/test-parity/snapshots/cpp.json`).

    ### Naming Conventions
    - The path format of routes has the next format `/<KAFKA_TOPIC_NAME>/<MESSAGE_TYPE_NAME>`.
    - The reply message topic name is define by the global SVT naming conventions `*.reply`, e.g:
      - request message topic `svt.db-agent.request` => reply topic name `svt.db-agent.request.reply`
    - Each message structure follows the global SVT naming conventions

    ### POST Request Meaning
    - Request body describes Kafka Message structure
    - Response
      - if response is specified, the relevant message will be emmited to the relevant *.reply topic as a reply to that message.

    ### Envelope
    - Request headers: `kafka_correlationId` and `kafka_replyPartition` are required. A request without one of
      them is answered `BadRequest` with `type: ""`. `kafka_replyTopic` is not read: the reply always goes to
      `svt.db-agent.request.reply`, to the partition of `kafka_replyPartition`.
    - Reply headers: `kafka_correlationId`, `kafka_replyPartition` and `kafka_nest-is-disposed` (`00`). Replies
      are not compressed.
    - Reply `status` is `Success` or `BadRequest`, nothing else (R-8). Every failure is a `BadRequest`: an
      invalid request, an id that does not exist, an SQL error, a lost database connection.
    - `error` is `{ "code": 0, "message": "" }` on success and `{ "code": -1, "message": "<reason>" }` on
      failure, and `data` is `null` on failure. Many messages start with the C++ source location
      (`[<file>:<line>]` and a new line). An SQL error carries the message of the database (R-9).
    - A `type` that no handler serves is answered `BadRequest`, `type: "<type>Reply"`,
      `Error: Request <type> not Found`. An empty `type` is answered `BadRequest`, `type: ""`, `Empty type`.
    - A record whose value is not JSON, or has no `type`, or has a `type` that is not a string, gets no reply:
      the process ends (X-10) and the container starts it again. At start the consumer (group
      `svt.db-agent.request`) goes to the end of the topic, so the agent does not serve the requests that were
      produced while it was down.
    - The agent serves one request at a time. It uses no database transaction: each SQL statement commits on
      its own, so a request that fails after its first statement leaves the earlier writes (X-1).
    - Values go into the SQL text without escaping (X-2). A `'` in a string value makes the request a
      `BadRequest`.

    ### Lists, filters and paging
    - `data.filter` may hold only the keys declared for the message. Another key is a `BadRequest`
      (`Error: <key> is not an allowed filter.`).
    - A list value becomes `IN (…)`. Its values must be all integers or all strings; a mixed list is a
      `BadRequest`. An empty list is ignored. A number or a string becomes `=`. `null`, a boolean or an object
      is ignored without an error (X-6).
    - Every `GetAll*` message except `GetAllEnums` accepts `data.pager = { limit, offset }`, also where the
      schema below does not show it. With a pager, `limit` defaults to 20 and `offset` to 0. An `offset`
      greater than the number of matching rows is a `BadRequest`, and so is a `null` `limit`. The agent reads
      all matching rows and then cuts the page in memory (X-4).
    - Without a pager the reply holds all matching rows. When more than 5000 rows match, the reply is
      `items: []` with `totalCount: 0` (R-13).
    - Every list reply has `totalCount`, the number of rows that match the filter, also where the schema below
      does not show it (R-12). The location histories are the exception: they have no `totalCount`.
    - Lists are ordered by `id`, ascending. The location histories have no defined order.

    ### Create and update
    - `Create*` reads `data.create`. The agent counts the keys of `create`: there must be at least as many as
      the entity has required columns (`Incorrect number of paramenters. Required: <n> and entry size is: <m>`
      otherwise). It does not check the names. Thus every key that is marked required below must be present,
      also where its value may be `null` (D-9, D-10).
    - On create, a `null`, a boolean, a list or an object is left out of the `INSERT`, and the default of the
      database applies (X-6). One exception: an object sent as `configBody` is stored as JSON text.
    - `Update*` reads `data.id` and `data.update`. An unknown id is a `BadRequest`
      (`Object with id <id> does not found.`). A `null` in `update` is ignored, so a value cannot be cleared.
      An empty `update` succeeds without a change. The agent does not check the keys of `update`: a key that
      is not a column of the table fails in the database.
    - The agent reads the id of a new row with `SELECT MAX(id)` (X-3).

    ### Values on the wire
    - Dates (`thinningDate`, `dicingDate`, `productionDate`, `arriveDate`, history `date`, config `createdAt`)
      are strings `YYYY-MM-DD`. The test timestamps (`createdAt`, `startedAt`, `finishedAt` of `SvtTestDto`)
      are strings in the text form of PostgreSQL, without a time zone, e.g. `2025-06-03 23:59:12.123456` (R-6).
    - JSON fields (`waferMap`, `configBody`, `specification`, `local2GlobalMap`) are returned as strings, as
      stored. Send them as strings: an object is left out of the `INSERT`, except for `configBody` (R-7).
    - Entity keys come in alphabetical order (R-14). Do not depend on the key order.
    - Enum values are strings. The agent reads the enum types of the database one time, at start: a value added
      later is not known to it until it starts again (X-11).

    ### Not served
    These message types were in this file before 2026-11-18. The agent has no handler for them and answers
    `BadRequest`, `Error: Request <type> not Found`:
    - `GetAllChipBlocks`. The agent also has no handler for `GetAllBlocks`, the type that the BFF sends and the
      re-implementation serves.
    - `GetAllModules`, `CreateModule`, `UpdateModuleLocation`, `GetModuleLocationHistory`: the Module entity is
      not finished in the code.

    ### Served without a known consumer
    `UpdateChip`, `UpdateEquipment` and `CreateProbeCard` are handlers of the code that this file did not
    describe before 2026-11-18. No consumer is known to send them, and the re-implementation does not serve them.

    ### Heartbeat and health
    - Every 2 s the agent produces `{ "timestamp": "<epoch seconds>.<6 decimals>" }` to
      `svt.db-agent.heartbeat` (tag *Heartbeat* below).
    - The Docker health check of the image (`svt-db-agent-healthcheck`) waits for one heartbeat record. It does
      not check the database connection (X-16).

    ### Useful Links
    - Online Swagger Editor: [https://editor-next.swagger.io](https://editor-next.swagger.io)
    - SVT Kafka Naming Conventions: [README](https://github.com/SVT-WP2/SVTSW/blob/master/Documentation/Kafka/SvtKafkaConventions.md)
    - The contract of the re-implementation: [svt.db-agent-next.kafka.yaml](https://github.com/SVT-WP2/SVTSW/blob/master/Documentation/Kafka/svt.db-agent-next.kafka.yaml)
    - The behaviour of the C++ agent in detail: [DbAgent/docs](https://github.com/SVT-WP2/SVTSW/blob/master/DbAgent/docs/README.md)
  version: 0.0.1
#
paths:
  /svt.db-agent.request/GetAllWaferTypes:
    post:
      tags:
        - Wafer Types
      summary: Get All Wafer Types
      description: Returns Wafer Types list in the reply message. Optional filter by Wafer Type Ids can be applied to return exact set of Wafer Types.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/GetAllWaferTypesMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/GetAllWaferTypesReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/CreateWaferType:
    post:
      tags:
        - Wafer Types
      summary: Create WaferType
      description: >-
        Returns the newly created WaferType in the reply message, without `waferMap`.
        The request must also have a `data.waferMap` key, with any value: the agent does not read it, and reads the map
        from `data.create.waferMap` (D-7). The agent validates the map before it writes: every `FamilyType` must be a
        value of `asicFamilyType` that the agent knew at start, and `error.message` lists all violations. The type row
        and the map row are two statements: when the map row fails, the type row stays (X-1).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/CreateWaferTypeMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/CreateWaferTypeReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/GetWaferTypeMap:
    post:
      tags:
        - Wafer Types
      summary: Get WaferTypeMap.
      description: >-
        Return the wafer type map for the wafer type id (waferTypeId).
        An unknown id, or a wafer type without a map, is a `BadRequest` (`Failed to access Wafer location records`).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/GetWaferTypeMapMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/GetWaferTypeMapReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/GetAllWafers:
    post:
      tags:
        - Wafers
      summary: Get All Wafers
      description: Returns Wafers list in the reply message. Optional filter by wafersIds can be applied to return exact set of Wafers.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/GetAllWafersMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/GetAllWafersReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/CreateWafer:
    post:
      tags:
        - Wafers
      summary: Create Wafer
      description: >-
        Returns the newly created Wafer in the reply message.
        Writes the wafer, its first location row (`note: Location at creation`) and one ASIC for each die of the map
        of the wafer type. Each row is a statement of its own (X-1). All seven keys of `create` must be present; the
        three dates may be `null` (D-9).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/CreateWaferMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/CreateWaferReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/UpdateWafer:
    post:
      tags:
        - Wafers
      summary: Update Wafer
      description: >-
        Returns updated Wafer in the reply message.
        `generalLocation` in `update` is a `BadRequest`: use `UpdateWaferLocation`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/UpdateWaferMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/UpdateWaferReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/UpdateWaferLocation:
    post:
      tags:
        - Wafers
      summary: Update Wafer Location
      description: >-
        Returns updated Wafer in the reply message.
        Appends a history row. Then it sets `generalLocation` of the wafer to the location of the history row with
        the newest `date`. That row is not always the new row: `date` has day resolution, and a row with a later date
        wins (X-9). All five keys must be present; `date`, `username` and `note` may be `null` (D-11).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/UpdateWaferLocationMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/UpdateWaferLocationReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/GetWaferLocationHistory:
    post:
      tags:
        - Wafers
      summary: Get Wafer Location History Records
      description: >-
        Return list of location records for a wafer.
        The reply has no `totalCount` and no defined order. An unknown id gives an empty list.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/GetWaferLocationHistoryMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/GetWaferLocationHistoryReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/GetAllAsics:
    post:
      tags:
        - Asics
      summary: Get All Asics
      description: >-
        Returns Asics list in the reply message. Optional filter by asicIds and waferId can be applied to return exact set of Asics.
        The `chipId` filter is a `BadRequest` (D-6). Without a pager, more than 5000 matching ASICs give an empty list
        (R-13): filter by `waferId` or send a pager.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/GetAllAsicsMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/GetAllAsicsReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/CreateAsic:
    post:
      tags:
        - Asics
      summary: Create Asic
      description: Returns the newly created Asic in the reply message
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/CreateAsicMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/CreateAsicReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/GetAllChips:
    post:
      tags:
        - Chips
      summary: Get All Chips
      description: >-
        Returns Chips list in the reply message. Optional filter by chipId can be applied to return exact chip.
        The `familyTypes` filter is a `BadRequest` (D-5).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/GetAllChipsMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/GetAllChipsReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/CreateChip:
    post:
      tags:
        - Chips
      summary: Create chip
      description: >-
        Returns the newly created chip in the reply message.
        Writes the chip and its first location row (`note: Location at creation`). It creates no chip blocks: the
        block generation of the code does not run (X-7).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/CreateChipMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/CreateChipReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/CreateManyChips:
    post:
      tags:
        - Chips
      summary: Create many chips
      description: >-
        Creates the chips of `data.create.items` at `data.create.generalLocation`, each as `CreateChip` does.
        The request must also have a `data.items` key, with any value: the agent does not read it (D-8). The reply
        lists all chips of the database, not only the new chips (R-2).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/CreateManyChipsMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/CreateManyChipsReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/UpdateChip:
    post:
      tags:
        - Chips
      summary: Update Chip
      description: >-
        Returns updated Chip in the reply message.
        Not in this file before 2026-11-18. No consumer is known to send it, and the re-implementation does not serve it.
        `generalLocation` in `update` is a `BadRequest`: use `UpdateChipLocation`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/UpdateChipMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/UpdateChipReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/UpdateChipLocation:
    post:
      tags:
        - Chips
      summary: Update Chip Location
      description: >-
        Returns updated Chip in the reply message.
        Appends a history row. Then it sets `generalLocation` of the chip to the location of the history row with
        the newest `date`. That row is not always the new row: `date` has day resolution, and a row with a later date
        wins (X-9). All five keys must be present; `date`, `username` and `note` may be `null` (D-11).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/UpdateChipLocationMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/UpdateChipLocationReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/GetChipLocationHistory:
    post:
      tags:
        - Chips
      summary: Get Chip Location History Records
      description: >-
        Return list of location records for a chip.
        The reply has no `totalCount` and no defined order. An unknown id gives an empty list.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/GetChipLocationHistoryMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/GetChipLocationHistoryReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  # WaferProbeMachines
  /svt.db-agent.request/GetAllWaferProbeMachines:
    post:
      tags:
        - Wafer Probe Machines
      summary: Get All WaferProbeMachines
      description: Returns WaferProbeMachines list in the reply message. Optional filter by WaferProbeMachine Ids can be applied to return exact set of WaferProbeMachines.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/GetAllWaferProbeMachinesMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/GetAllWaferProbeMachinesReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/CreateWaferProbeMachine:
    post:
      tags:
        - Wafer Probe Machines
      summary: Create WaferProbeMachine
      description: Returns the newly created WaferProbeMachine in the reply message
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/CreateWaferProbeMachineMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/CreateWaferProbeMachineReplyMessage"
        default:
          description: Unexpected error
          content:
