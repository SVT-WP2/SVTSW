  /svt.db-agent.request/GetSvtTestTypeConfigBody:
    post:
      tags:
        - SvtTestTypeConfig
      summary: Get SvtTestTypeConfig JSON
      description: >-
        Returns configuration JSON in the reply message.
        An unknown id is answered `Success` with `entity: null` (X-12).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/GetSvtTestTypeConfigBodyMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/GetSvtTestTypeConfigBodyReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/CreateSvtTestTypeConfig:
    post:
      tags:
        - SvtTestTypeConfig
      summary: Create SvtTestTypeConfig
      description: >-
        Returns the newly created test type configuration in the reply message, without `configBody`.
        The `note` key must be present; its value may be `null` (D-10). `configBody` is a string, or an object that the
        agent stores as JSON text.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/CreateSvtTestTypeConfigMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/CreateSvtTestTypeConfigReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  # TEST_TEMPLATE
  /svt.db-agent.request/GetAllSvtTestTemplates:
    post:
      tags:
        - SvtTestTemplate
      summary: Get all SvtTestTemplate
      description: >-
        Returns SvtTestTemplate list in the reply message. Optional filter by ids or DUT types.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/GetAllSvtTestTemplatesMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/GetAllSvtTestTemplatesReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/CreateSvtTestTemplate:
    post:
      tags:
        - SvtTestTemplate
      summary: Create an entry to the SvtTestTemplate
      description: >-
        Returns the newly created entry to the SvtTestTemplate in the reply message.
        The agent does not store `isEnabled`: a new template is always enabled (D-12). Use `UpdateSvtTestTemplate` to
        disable it.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/CreateSvtTestTemplateMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/CreateSvtTestTemplateReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/UpdateSvtTestTemplate:
    post:
      tags:
        - SvtTestTemplate
      summary: Update entry to the SvtTestTemplate
      description: Returns the updated entry to the SvtTestTemplate in the reply message
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/UpdateSvtTestTemplateMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/UpdateSvtTestTemplateReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  # TEST_LIST
  /svt.db-agent.request/GetAllSvtTests:
    post:
      tags:
        - SvtTest
      summary: Get all SvtTest
      description: >-
        Returns SvtTest list in the reply message, ordered by `id`, ascending.
        The only filter is `ids`; every other filter key is a `BadRequest` (D-3). A test without a row in
        `SvtTestListToEntityName` or in `SvtTestListToEntityId` makes the whole request a `BadRequest` (X-5).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/GetAllSvtTestsMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/GetAllSvtTestsReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/CreateSvtTest:
    post:
      tags:
        - SvtTest
      summary: Create an entry to the SvtTest
      description: >-
        Returns the newly created entry to the SvtTest in the reply message.
        The database sets `createdAt`. The agent writes `dutEntityName` and `dutId` to the two link tables after the
        test row (X-1); it does not check that the device exists.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/CreateSvtTestMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/CreateSvtTestReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/UpdateSvtTestStart:
    post:
      tags:
        - SvtTest
      summary: Update entry to the SvtTest with test start info
      description: >-
        Returns the updated entry to the SvtTest in the reply message.
        A generic update: the agent does not check the order created, started, finished.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/UpdateSvtTestStartMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/UpdateSvtTestStartReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/UpdateSvtTestFinish:
    post:
      tags:
        - SvtTest
      summary: Update entry to the SvtTest
      description: >-
        Returns the updated entry to the SvtTest in the reply message.
        A generic update: the agent does not check the order created, started, finished, and it does not check
        `testResultStatus` (the database does).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/UpdateSvtTestFinishMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/UpdateSvtTestFinishReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  # ENUMS
  /svt.db-agent.request/GetAllEnums:
    post:
      tags:
        - Enums
      summary: Request All Enums.
      description: >-
        Returns the enum types of the database schema with their values, by the type names of the database.
        The agent reads only `data.enumNames`. A request with `data.filter.enumNames` (what the UI sends) or with
        `data.enumsNames` gets every enum type (D-2). The values are those that the agent read at start (X-11).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/GetAllEnumsRequest"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/GetAllEnumsReply"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  # Heartbeat
  /svt.db-agent.heartbeat:
    post:
      tags:
        - Heartbeat
      summary: Heartbeat record
      description: >-
        Produced by the agent every 2 s, without headers or key; nothing is expected back.
        The Docker health check of the image consumes it.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatMessage"
        required: true
      responses:
        "204":
          description: No reply

components:
  schemas:
    HeartbeatMessage:
      type: object
      required:
        - timestamp
      properties:
        timestamp:
          type: string
          description: Seconds since the epoch with six decimals, as a string, e.g. `1762500000.123456`.
    RequestMessage:
      type: object
      required:
        - type
      properties:
        type:
          type: string
        data:
          type: object
    ReplyMessage:
      type: object
      required:
        - status
        - type
        - data
        - error
      properties:
        status:
          $ref: "#/components/schemas/ReplyStatus"
        type:
          type: string
          description: "`<request type>Reply`; an empty string when a required header is missing or the request `type` is empty."
        data:
          type: object
          nullable: true
          description: The reply payload on `Success`, `null` on `BadRequest`.
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: number
              description: "`0` on `Success`, `-1` on `BadRequest`."
            message:
              type: string
              description: Empty on `Success`. Otherwise the text of the C++ exception, often after a `[<file>:<line>]` prefix, or the message of the database (R-9).
    ReplyStatus:
      type: string
      description: The agent sends `Success` or `BadRequest` only. It never sends `NotFound` or `UnexpectedError` (R-8).
      enum:
        - Success
        - BadRequest
    GetAllEnumsRequest:
      properties:
        type:
          type: string
          default: "GetAllEnums"
        data:
          type: object
          properties:
            enumNames:
              type: array
              description: >-
                The enum types to return, by their names in the database. Without this key the reply has every
                enum type. An unknown name gives an empty list.
              items:
                $ref: "#/components/schemas/SvtEnumName"
    GetAllEnumsReply:
      properties:
        type:
          type: string
          default: "GetAllEnumsReply"
        data:
          type: object
          description: >-
            One key for each enum type of the database schema, by the name of the type in the database. The keys
            below are the types of the dev database of 2026-11-08. The prod database of that day had no
            `dutEntityName` and no `testResultStatus`.
          properties:
            asicFamilyType:
              type: array
              items:
                type: string
            asicQuality:
              type: array
              items:
                type: string
            blockType:
              type: array
              items:
                type: string
            moduleType:
              type: array
              items:
                type: string
            dutType:
              type: array
              items:
                type: string
            dutEntityName:
              type: array
              items:
                type: string
            engineeringRun:
              type: array
              items:
                type: string
            foundryName:
              type: array
              items:
                type: string
            pcLocation:
              type: array
              items:
                type: string
            pcModel:
              type: array
              items:
                type: string
            pcName:
              type: array
              items:
                type: string
            pcType:
              type: array
              items:
                type: string
            pcVendor:
              type: array
              items:
                type: string
            waferTech:
              type: array
              items:
                type: string
            waferInMachineStatus:
              type: array
              items:
                type: string
            waferMapOrientation:
              type: array
              items:
                type: string
            wpConnectionType:
              type: array
              items:
                type: string
            wpGeneralLocation:
              type: array
              items:
                type: string
            wpSwType:
              type: array
              items:
                type: string
            wpVendor:
              type: array
              items:
                type: string
    #
    # WAFER TYPES :: LIST
    #
    GetAllWaferTypesMessage:
      properties:
        type:
          type: string
          default: "GetAllWaferTypes"
        data:
          type: object
          properties:
            filter:
              type: object
              properties:
                ids:
                  type: array
                  description: Wafer Type ids array. If array is empty / undefined => all wafers will be returned.
                  items:
                    type: number
    GetAllWaferTypesReplyMessage:
      properties:
        type:
          type: string
          default: "GetAllWaferTypesReply"
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/WaferTypeDto"
    GetWaferTypeMapMessage:
      properties:
        type:
          type: string
          default: "GetWaferTypeMap"
        data:
          type: object
          required:
            - waferTypeId
          properties:
            waferTypeId:
              type: number
              description: Wafer type id
    GetWaferTypeMapReplyMessage:
      properties:
        type:
          type: string
          default: "GetWaferTypeMapReply"
        data:
          type: object
          properties:
            entity:
              $ref: "#/components/schemas/WaferTypeMapDto"
    #
    # WAFER TYPES :: CREATE
    #
    CreateWaferTypeMessage:
      properties:
        type:
          type: string
          default: "CreateWaferType"
        data:
          type: object
          required:
            - create
            - waferMap
          properties:
            create:
              $ref: "#/components/schemas/WaferTypeCreateDto"
            waferMap:
              description: Must be present, with any value. The agent does not read it (D-7); it reads `create.waferMap`.
    CreateWaferTypeReplyMessage:
      properties:
        type:
          type: string
          default: "CreateWaferTypeReply"
        data:
          type: object
          properties:
            entity:
              $ref: "#/components/schemas/WaferTypeDto"
    #
    # WAFERS :: LIST
    #
    GetAllWafersMessage:
      properties:
        type:
          type: string
          default: "GetAllWafers"
        data:
          type: object
          properties:
            filter:
              type: object
              properties:
                ids:
                  type: array
                  description: Wafer ids array. If array is empty / undefined => all wafers will be returned.
                  items:
                    type: number
    GetAllWafersReplyMessage:
      properties:
        type:
          type: string
          default: "GetAllWafersReply"
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/WaferDto"
    #
    # WAFERS :: CREATE
    #
    CreateWaferMessage:
      properties:
        type:
          type: string
          default: "CreateWafer"
        data:
          type: object
          properties:
            create:
              $ref: "#/components/schemas/WaferCreateDto"
    CreateWaferReplyMessage:
      properties:
        type:
          type: string
          default: "CreateWaferReply"
        data:
          type: object
          properties:
            entity:
              $ref: "#/components/schemas/WaferDto"
    #
    # WAFERS :: UPDATE
    #
    UpdateWaferMessage:
      properties:
        type:
          type: string
          default: "UpdateWafer"
        data:
          type: object
          required:
            - id
            - update
          properties:
            id:
              type: number
              description: Wafer Id
            update:
              $ref: "#/components/schemas/WaferUpdateDto"
    UpdateWaferReplyMessage:
      properties:
        type:
          type: string
          default: "UpdateWaferReply"
        data:
          type: object
          properties:
            entity:
              $ref: "#/components/schemas/WaferDto"
    #
    # WAFERS :: UPDATE LOCATION
    #
    UpdateWaferLocationMessage:
      properties:
        type:
          type: string
          default: "UpdateWaferLocation"
        data:
          $ref: "#/components/schemas/WaferUpdateLocationDto"
    UpdateWaferLocationReplyMessage:
      properties:
        type:
          type: string
          default: "UpdateWaferLocationReply"
        data:
          type: object
          properties:
            entity:
              $ref: "#/components/schemas/WaferDto"
    #
    # WAFER LOCATION RECORDS
    #
    GetWaferLocationHistoryMessage:
      properties:
        type:
          type: string
          default: "GetWaferLocationHistory"
        data:
          type: object
          required:
            - waferId
          properties:
            waferId:
              type: number
              description: Wafer id
    GetWaferLocationHistoryReplyMessage:
      properties:
        type:
          type: string
          default: "GetWaferLocationHistoryReply"
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/WaferLocationHistoryRecordDto"
    #
    # ASICS :: LIST
    #
    GetAllAsicsMessage:
      properties:
        type:
          type: string
          default: "GetAllAsics"
        data:
          type: object
          properties:
            pager:
              type: object
              properties:
                limit:
                  type: number
                  description: Default value is 20. That value will be used if no limit specified.
                offset:
                  type: number
                  description: Default value is 0. That value will be used if no offset specified.
            filter:
              type: object
              properties:
                familyTypes:
                  type: array
                  description: AsicFamilType values array. If array is empty / undefined => all Asics will be returned.
                  items:
                    type: string
                waferId:
                  type: number
                  description: Optional filter used to fetch all ASICs for the particular wafer
                chipId:
                  type: number
                  description: "Declared by the agent, but not usable. A request with this key is a `BadRequest` (`Error: getting entries`, D-6)."
                quality:
                  type: string
                serialNumber:
                  type: string
                  description: Optional filter used to fetch ASIC with particular serial number
                ids:
                  type: array
                  description: Asic ids array. If array is empty / undefined => all Asics will be returned.
                  items:
                    type: number
    GetAllAsicsReplyMessage:
      properties:
        type:
          type: string
          default: "GetAllAsicsReply"
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AsicDto"
            totalCount:
              type: number
    #
    # ASICS :: CREATE
    #
    CreateAsicMessage:
      properties:
        type:
          type: string
          default: "CreateAsic"
        data:
          type: object
          properties:
            create:
              $ref: "#/components/schemas/AsicCreateDto"
    CreateAsicReplyMessage:
      properties:
        type:
          type: string
          default: "CreateAsicReply"
        data:
          type: object
          properties:
            entity:
              $ref: "#/components/schemas/AsicDto"
    #
    # CHIPS :: LIST
    #
    GetAllChipsMessage:
      properties:
        type:
          type: string
          default: "GetAllChips"
        data:
          type: object
          properties:
            pager:
              type: object
              properties:
                limit:
                  type: number
                  description: Default value is 20. That value will be used if no limit specified.
                offset:
                  type: number
                  description: Default value is 0. That value will be used if no offset specified.
            filter:
              type: object
              properties:
                familyTypes:
                  type: array
                  description: Declared by the agent, but not usable. A request with a list that is not empty is a `BadRequest` (`Invalid filter familyTypes, col familyType non found in Table Chip`, D-5).
                  items:
                    type: string
                generalLocation:
                  type: string
                serialNumber:
                  type: string
                ids:
                  type: array
                  description: Chip ids array. If array is empty / undefined => all Chip will be returned.
                  items:
                    type: number
    GetAllChipsReplyMessage:
      properties:
        type:
          type: string
          default: "GetAllChipsReply"
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ChipDto"
            totalCount:
              type: number
    #
    # CHIPS :: CREATE
    #
    CreateChipMessage:
      properties:
        type:
          type: string
          default: "CreateChip"
        data:
          type: object
          properties:
            create:
              $ref: "#/components/schemas/ChipCreateDto"
    CreateChipReplyMessage:
      properties:
        type:
          type: string
          default: "CreateChipReply"
        data:
          type: object
          properties:
            entity:
              $ref: "#/components/schemas/ChipDto"
    #
    # CHIPS :: CREATE MANY
    #
    CreateManyChipsMessage:
      properties:
        type:
          type: string
          default: "CreateManyChips"
        data:
          type: object
          required:
            - create
            - items
          properties:
            items:
              description: Must be present, with any value. The agent does not read it (D-8); it reads `create.items`.
            create:
              type: object
              required:
                - generalLocation
                - items
              properties:
                generalLocation:
                  type: string
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/ManyChipsCreateDto"
    CreateManyChipsReplyMessage:
      properties:
        type:
          type: string
          default: "CreateManyChipsReply"
        data:
          type: object
          properties:
            items:
              type: array
              description: All chips of the database, not only the new chips (R-2).
              items:
                $ref: "#/components/schemas/ChipDto"
            totalCount:
              type: number
    #
    # CHIPS :: UPDATE
    #
    UpdateChipMessage:
      properties:
        type:
          type: string
          default: "UpdateChip"
        data:
          type: object
          required:
            - id
            - update
          properties:
            id:
              type: number
              description: Chip Id
            update:
              $ref: "#/components/schemas/ChipUpdateDto"
    UpdateChipReplyMessage:
      properties:
        type:
          type: string
          default: "UpdateChipReply"
        data:
          type: object
          properties:
            entity:
              $ref: "#/components/schemas/ChipDto"
    #
    # CHIPS :: UPDATE LOCAION
    #
    UpdateChipLocationMessage:
      properties:
        type:
          type: string
          default: "UpdateChipLocation"
        data:
          $ref: "#/components/schemas/ChipUpdateLocationDto"
    UpdateChipLocationReplyMessage:
      properties:
        type:
          type: string
          default: "UpdateChipLocationReply"
        data:
          type: object
          properties:
            entity:
              $ref: "#/components/schemas/ChipDto"
    #
    # CHIP LOCATION RECORDS
    #
    GetChipLocationHistoryMessage:
      properties:
        type:
          type: string
          default: "GetChipLocationHistory"
        data:
          type: object
          required:
            - chipId
          properties:
            chipId:
              type: number
              description: Chip id
    GetChipLocationHistoryReplyMessage:
      properties:
        type:
          type: string
          default: "GetChipLocationHistoryReply"
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ChipLocationHistoryRecordDto"
    #
