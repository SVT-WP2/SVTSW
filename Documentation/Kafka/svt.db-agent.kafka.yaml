  /svt.db-agent.request/CreateSvtTestSetup:
    post:
      tags:
        - SvtTestSetup
      summary: Create SvtTestSetup
      description: >-
        Does not work in the agent: the request is always a `BadRequest` (`vector::_M_range_check…`).
        The agent writes the setup row and then reads the setup back, before the row of `SvtTestSetupDefaultConfig`
        exists (X-5). It does not write the default config. The setup row stays (X-1), and from then on
        `GetAllSvtTestSetups` fails for that setup, until the setup gets a default config directly in the database.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/CreateSvtTestSetupMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/CreateSvtTestSetupReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/UpdateSvtTestSetup:
    post:
      tags:
        - SvtTestSetup
      summary: Update test setup default configuration
      description: >-
        Sets `defaultConfigId` in the row of `SvtTestSetupDefaultConfig` of the setup and returns the test setup.
        The agent does not create that row (X-13): for a setup without one, the request is a `BadRequest`
        (`vector::_M_range_check…`). The agent does not check that the config belongs to the setup.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/UpdateSvtTestSetupMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/UpdateSvtTestSetupReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
