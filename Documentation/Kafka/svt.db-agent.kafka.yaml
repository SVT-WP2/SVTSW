    SvtTestDto:
      required:
        - id
        - dutEntityName
        - dutId
        - testTypeConfigId
        - testSetupConfigId
        - createdAt
        - startedAt
        - finishedAt
        - pathToResult
        - testResultStatus
      properties:
        id:
          type: number
        dutEntityName:
          type: string
          description: A value of the `dutEntityName` enum (`Asic`, `Chip`, `ChipBlock`).
        dutId:
          type: number
        testTypeConfigId:
          type: number
        testSetupConfigId:
          type: number
        createdAt:
          type: string
          description: Timestamp in the text form of PostgreSQL, without a time zone, e.g. `2025-06-03 23:59:12.123456` (R-6). Set by the database.
        startedAt:
          type: string
          nullable: true
          description: Same form as `createdAt`; `null` until the test is started.
        finishedAt:
          type: string
          nullable: true
          description: Same form as `createdAt`; `null` until the test is finished.
        pathToResult:
          type: string
          nullable: true
          description: "`null` until the test is finished."
        testResultStatus:
          type: string
          nullable: true
          description: >-
            `null` until the test is finished. A value of the `testResultStatus` enum of the database. At the
            freeze the values were `SUCCESS`, `PARTIAL_SUCCESS`, `FAILURE`, `ERROR`; a migration of the
            re-implementation adds `CANCELLED` to the database.
    SvtTestCreateDto:
      required:
        - dutEntityName
        - dutId
        - testTypeConfigId
        - testSetupConfigId
      properties:
        dutEntityName:
          type: string
        dutId:
          type: number
        testTypeConfigId:
          type: number
        testSetupConfigId:
          type: number
    SvtTestStartUpdateDto:
      required:
        - startedAt
      properties:
        startedAt:
          type: string
          description: A timestamp that PostgreSQL can read, e.g. `2025-06-03T23:59:12Z`. The column has no time zone.
    SvtTestFinishUpdateDto:
      required:
        - finishedAt
        - pathToResult
        - testResultStatus
      properties:
        finishedAt:
          type: string
          description: A timestamp that PostgreSQL can read, e.g. `2025-06-03T23:59:12Z`. The column has no time zone.
        pathToResult:
          type: string
        testResultStatus:
          type: string
          description: The agent does not check the value; the database rejects a value that is not in its `testResultStatus` enum.
