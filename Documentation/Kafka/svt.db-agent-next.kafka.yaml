openapi: "3.0.1"
info:
  title: SVT DB Agent Next
  description: |
    The Kafka communication layer definitions for `svt-db-agent-next`, the NestJS re-implementation of the
    `SVT DB Agent Service` (`DbAgentNext/`). It serves the same topics and message types as the
    C++ agent, whose contract stays in `svt.db-agent.kafka.yaml`; this file describes what the re-implementation
    does, so that every difference from the C++ agent is documented here and not only in the code. The
    reasoning behind each difference is in `DbAgentNext/docs/01-behaviour-decisions.md`; the ids `D-…`,
    `R-…`, `X-…` quoted below are the rows of `DbAgent/docs/07-contract-drift-and-quirks.md`, and `Q-n` the
    questions of `DbAgent/docs/08-questions-for-the-author.md`.

    ### Naming Conventions
    - The path format of routes has the next format `/<KAFKA_TOPIC_NAME>/<MESSAGE_TYPE_NAME>`.
    - The reply message topic name is define by the global SVT naming conventions `*.reply`, e.g:
      - request message topic `svt.db-agent.request` => reply topic name `svt.db-agent.request.reply`
    - Each message structure follows the global SVT naming conventions

    ### POST Request Meaning
    - Request body describes Kafka Message structure
    - Response
      - if response is specified, the relevant message will be emmited to the relevant *.reply topic as a reply to that message.

    ### Envelope
    - Reply `status`: `Success`; `BadRequest` for a malformed or invalid request (a value of the wrong type, an
      unknown filter key, a value that is not in its enum, a duplicate of a unique value, a broken business
      rule); `NotFound` when the entity an id refers to does not exist; `UnexpectedError` for database and
      infrastructure failures. The C++ agent only ever replied `Success` or `BadRequest` (R-8).
    - `error` is `{ "code": 0, "message": "" }` on success and `{ "code": -1, "message": "<reason>" }` on
      failure, and `data` is `null` on failure. Messages carry neither source locations nor SQL (R-9).
    - A record whose value is not JSON, or has no string `type` (or an empty one), is answered `BadRequest`
      with `type: "UnknownRequestReply"` and the agent keeps serving (the C++ process exited, X-10). A `type`
      nobody serves is answered `BadRequest` with `type: "<type>Reply"` and `Unknown request type: <type>`.
    - Headers as in the conventions: `kafka_correlationId`, `kafka_replyTopic`, `kafka_replyPartition`. The
      reply goes to the topic named in `kafka_replyTopic` (every client sends `svt.db-agent.request.reply`);
      a record without `kafka_correlationId` or without `kafka_replyTopic` is treated as an event and gets no
      reply. Replies are gzip-compressed records.
    - Every request runs in one database transaction: a request that fails half-way leaves nothing behind
      (the C++ committed every statement on its own, X-1).

    ### Lists, filters and paging
    - `data.filter` may only hold the keys declared for the message; an unknown key is a `BadRequest`
      (`Error: <key> is not an allowed filter.`).
    - An empty list (`[]`), an absent key or `null` means "no filter". A value of the wrong type (`true`, a
      list of mixed types, a non-integer id) is a `BadRequest`; a string that is no value of the column's
      enum is a `BadRequest` (`Error: "<value>" is not a value of the <enum> enum`). The C++ ignored such
      values silently (Q-F1).
    - `data.pager = { limit, offset }` is applied in the database (`LIMIT`/`OFFSET`, X-4): with a pager,
      `limit` defaults to 20 and `offset` to 0; without one every matching row is returned (no 5000-row cap,
      R-13); an offset beyond the end returns `items: []` with the real `totalCount`.
    - Every list reply carries `totalCount`, the number of rows matching the filter (location histories
      included, R-12). Lists are ordered by `id`; location histories in insertion order.

    ### Values on the wire
    - Dates (`thinningDate`, `dicingDate`, `productionDate`, `arriveDate`, history `date`, config `createdAt`)
      are calendar dates `YYYY-MM-DD`. The test timestamps (`createdAt`, `startedAt`, `finishedAt` of
      `SvtTestDto`) are ISO 8601 date-times in UTC, e.g. `2026-11-09T19:23:22.626Z` (R-6).
    - JSON fields (`waferMap`, `configBody`, `specification`, `local2GlobalMap`) travel as strings and are
      returned byte for byte; an object or array sent instead is a `BadRequest` (the C++ dropped it, R-7).
    - A single quote or any other character is stored as sent (the C++ built SQL by concatenation, X-2).
    - Entity keys come in declaration order, not alphabetically (R-14); never depend on key order.
    - Enum values (`GetAllEnums`) are read from the database on every request, so a value added with
      `ALTER TYPE … ADD VALUE` is visible at once (X-11).

    ### Not served
    - `GetAllModules`, `CreateModule`, `UpdateModuleLocation`, `GetModuleLocationHistory`: the Module entity
      is unfinished (Q9) and the messages are answered `Unknown request type`, as by the C++ agent.
    - `GetEquipmentListForTestSetup`: `SvtTestSetupEquipList` is unused and the message is deferred (Q19).
    - `UpdateChip`, `UpdateEquipment`, `CreateProbeCard` exist only in the C++ code and are not served (Q37).

    ### Heartbeat and health
    - Every 2 s a record `{ "timestamp": "<epoch seconds>.<6 decimals>" }` is produced to
      `svt.db-agent.heartbeat` (tag *Heartbeat* below), as by the C++ agent.
    - `GET /health` (HTTP, port `SVT_DB_AGENT_HTTP_PORT`, 7676 by default) reports the database connection
      and the broker in the NestJS Terminus format (`status: "ok" | "error"`, indicators `database`, `kafka`).

    ### Useful Links
    - Online Swagger Editor: [https://editor-next.swagger.io](https://editor-next.swagger.io)
    - SVT Kafka Naming Conventions: [README](https://github.com/SVT-WP2/SVTSW/blob/master/Documentation/Kafka/SvtKafkaConventions.md)
    - The C++ agent's contract: [svt.db-agent.kafka.yaml](https://github.com/SVT-WP2/SVTSW/blob/master/Documentation/Kafka/svt.db-agent.kafka.yaml)
    - The decisions behind the differences: [01-behaviour-decisions.md](https://github.com/SVT-WP2/SVTSW/blob/master/DbAgentNext/docs/01-behaviour-decisions.md)
  version: 1.0.0
#
paths:
  /svt.db-agent.request/GetAllWaferTypes:
    post:
      tags:
        - Wafer Types
      summary: Get All Wafer Types
      description: Returns Wafer Types list in the reply message. Optional filter by Wafer Type Ids can be applied to return exact set of Wafer Types.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/GetAllWaferTypesMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/GetAllWaferTypesReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/CreateWaferType:
    post:
      tags:
        - Wafer Types
      summary: Create WaferType
      description: >-
        Returns the newly created WaferType in the reply message.
        The map is validated before anything is written (every `FamilyType` must be a value of `asicFamilyType`; all violations are listed in `error.message`) and only `data.create.waferMap` is read (the C++ also required a `data.waferMap` key, D-7). A duplicate `name` or `engineeringRun` is a `BadRequest`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/CreateWaferTypeMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/CreateWaferTypeReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/GetWaferTypeMap:
    post:
      tags:
        - Wafer Types
      summary: Get WaferTypeMap.
      description: >-
        Return the wafer type map for the wafer type id (waferTypeId).
        `NotFound` when the wafer type has no map.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/GetWaferTypeMapMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/GetWaferTypeMapReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/GetAllWafers:
    post:
      tags:
        - Wafers
      summary: Get All Wafers
      description: Returns Wafers list in the reply message. Optional filter by wafersIds can be applied to return exact set of Wafers.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/GetAllWafersMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/GetAllWafersReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/CreateWafer:
    post:
      tags:
        - Wafers
      summary: Create Wafer
      description: >-
        Returns the newly created Wafer in the reply message.
        Inserts the wafer, its first location row and every ASIC of the wafer type's map in one transaction. The three dates may be left out or `null` (D-9). A duplicate `serialNumber` is a `BadRequest`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/CreateWaferMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/CreateWaferReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/UpdateWafer:
    post:
      tags:
        - Wafers
      summary: Update Wafer
      description: >-
        Returns updated Wafer in the reply message.
        `NotFound` for an unknown id. `generalLocation` in `update` is rejected (`BadRequest`, use `UpdateWaferLocation`); an empty `update` succeeds without a change.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/UpdateWaferMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/UpdateWaferReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/UpdateWaferLocation:
    post:
      tags:
        - Wafers
      summary: Update Wafer Location
      description: >-
        Returns updated Wafer in the reply message.
        Appends a history row (`date` defaults to today, `username` may be left out, D-11) and makes it the wafer's current location (X-9). `NotFound` for an unknown wafer.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/UpdateWaferLocationMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/UpdateWaferLocationReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/GetWaferLocationHistory:
    post:
      tags:
        - Wafers
      summary: Get Wafer Location History Records
      description: >-
        Return list of location records for a wafer.
        `NotFound` for an unknown wafer; the reply carries `totalCount` (R-12).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/GetWaferLocationHistoryMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/GetWaferLocationHistoryReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/GetAllAsics:
    post:
      tags:
        - Asics
      summary: Get All Asics
      description: >-
        Returns Asics list in the reply message. Optional filter by asicIds and waferId can be applied to return exact set of Asics.
        Every declared filter works, `chipId` included (D-6). Without a pager the reply holds every matching ASIC (R-13), so filter by `waferId` or page.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/GetAllAsicsMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/GetAllAsicsReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/CreateAsic:
    post:
      tags:
        - Asics
      summary: Create Asic
      description: Returns the newly created Asic in the reply message
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/CreateAsicMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/CreateAsicReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/GetAllChips:
    post:
      tags:
        - Chips
      summary: Get All Chips
      description: >-
        Returns Chips list in the reply message. Optional filter by chipId can be applied to return exact chip.
        The `familyTypes` filter works (D-5).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/GetAllChipsMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/GetAllChipsReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/CreateChip:
    post:
      tags:
        - Chips
      summary: Create chip
      description: >-
        Returns the newly created chip in the reply message.
        Chip blocks are generated for the chip's family type only when the agent runs with `SVT_DB_AGENT_FEATURE_CHIP_BLOCKS=true` (off by default: the naming of blocks is not decided yet, Q6).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/CreateChipMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/CreateChipReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/CreateManyChips:
    post:
      tags:
        - Chips
      summary: Create many chips
      description: >-
        Returns created chip array in the reply message.
        Only `data.create.items` is read (the C++ also required a `data.items` key, D-8); the reply lists the created chips, not every chip (R-2). All chips are created in one transaction.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/CreateManyChipsMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/CreateManyChipsReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/UpdateChipLocation:
    post:
      tags:
        - Chips
      summary: Update Chip Location
      description: >-
        Returns updated Chip in the reply message.
        Appends a history row (`date` defaults to today, `username` may be left out, D-11) and makes it the chip's current location (X-9). `NotFound` for an unknown chip.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/UpdateChipLocationMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/UpdateChipLocationReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/GetChipLocationHistory:
    post:
      tags:
        - Chips
      summary: Get Chip Location History Records
      description: >-
        Return list of location records for a chip.
        `NotFound` for an unknown chip; the reply carries `totalCount` (R-12).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/GetChipLocationHistoryMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/GetChipLocationHistoryReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/GetAllBlocks:
    post:
      tags:
        - ChipBlocks
      summary: Get All chip blocks
      description: >-
        Returns chip block list in the reply message. Optional filter by chip block ids or chipId can be applied to return exact block list.
        Served under the type `GetAllBlocks`, which is what the BFF sends; the type `GetAllChipBlocks` of the C++ contract is served by neither agent. Items carry `chipBlockType`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/GetAllChipBlocksMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/GetAllChipBlocksReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  # WaferProbeMachines
  /svt.db-agent.request/GetAllWaferProbeMachines:
    post:
      tags:
        - Wafer Probe Machines
      summary: Get All WaferProbeMachines
      description: Returns WaferProbeMachines list in the reply message. Optional filter by WaferProbeMachine Ids can be applied to return exact set of WaferProbeMachines.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/GetAllWaferProbeMachinesMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/GetAllWaferProbeMachinesReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/CreateWaferProbeMachine:
    post:
      tags:
        - Wafer Probe Machines
      summary: Create WaferProbeMachine
      description: >-
        Returns the newly created WaferProbeMachine in the reply message.
        A duplicate `name` or `serialNumber` is a `BadRequest`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/CreateWaferProbeMachineMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/CreateWaferProbeMachineReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/UpdateWaferProbeMachine:
    post:
      tags:
        - Wafer Probe Machines
      summary: Update WaferProbeMachine
      description: >-
        Returns updated WaferProbeMachine in the reply message.
        `NotFound` for an unknown machine. `generalLocation` is updatable here (machines keep no location history).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/UpdateWaferProbeMachineMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/UpdateWaferProbeMachineReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/UpdateWpMachineLoadedWafer:
    post:
      tags:
        - Wafer Probe Machines
      summary: Update WaferProbeMachine Loaded Wafer
      description: >-
        Returns updated WaferProbeMachine in the reply message.
        Loading needs an existing wafer and `loadedWaferOrientation` (a value of `waferMapOrientation`); unloading (`loadedWaferId: null`) while nothing is loaded is a `BadRequest`. A swap records one `Loaded` row for the new wafer in `WaferLoadedInMachine`, as the C++ did: a load implies the unload of the previous wafer (Q13; X-8 withdrawn). `NotFound` for an unknown machine.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/UpdateWpMachineLoadedWaferMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/UpdateWpMachineLoadedWaferReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/UpdateWpMachineInstalledProbeCard:
    post:
      tags:
