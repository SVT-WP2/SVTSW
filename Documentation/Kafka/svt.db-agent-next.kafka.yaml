          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/CreateSvtTestMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/CreateSvtTestReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/UpdateSvtTestStart:
    post:
      tags:
        - SvtTest
      summary: Update entry to the SvtTest with test start info
      description: >-
        Returns the updated entry to the SvtTest in the reply message.
        `NotFound` for an unknown test. The order created → started → finished is not enforced; an out-of-order update is logged (Q25).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/UpdateSvtTestStartMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/UpdateSvtTestStartReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  /svt.db-agent.request/UpdateSvtTestFinish:
    post:
      tags:
        - SvtTest
      summary: Update entry to the SvtTest
      description: >-
        Returns the updated entry to the SvtTest in the reply message.
        `NotFound` for an unknown test; `testResultStatus` must be a value of `testResultStatus`. The order created → started → finished is not enforced; an out-of-order update is logged (Q25).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/UpdateSvtTestFinishMessage"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/UpdateSvtTestFinishReplyMessage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  # ENUMS
  /svt.db-agent.request/GetAllEnums:
    post:
      tags:
        - Enums
      summary: Request All Enums.
      description: >-
        Returns All Enums in the reply message according to the relevant filter. If filter is empty all enums will be returned.
        Names come as `data.filter.enumNames` (what the UI sends); `data.enumNames` and the C++ contract's `data.enumsNames` are accepted too (D-2). No names or an empty list returns every enum; an unknown name is left out of the reply. Values are read from the database on every request (X-11).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: "#/components/schemas/RequestMessage"
                - $ref: "#/components/schemas/GetAllEnumsRequest"
        required: true
      responses:
        "200":
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "#/components/schemas/ReplyMessage"
                  - $ref: "#/components/schemas/GetAllEnumsReply"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  # Heartbeat
  /svt.db-agent.heartbeat:
    post:
      tags:
        - Heartbeat
      summary: Heartbeat record
      description: >-
        Produced by the agent every 2 s, without headers or key; nothing is expected back. The Docker health check.
        of the C++ image consumes it; the re-implementation also exposes `GET /health` over HTTP.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatMessage"
        required: true
      responses:
        "204":
          description: No reply

components:
  schemas:
    HeartbeatMessage:
      type: object
      required:
        - timestamp
      properties:
        timestamp:
          type: string
          description: Seconds since the epoch with six decimals, as a string, e.g. `1762500000.123456`.
    RequestMessage:
      type: object
      required:
        - type
      properties:
        type:
          type: string
        data:
          type: object
    ReplyMessage:
      type: object
      required:
        - status
        - type
        - data
        - error
      properties:
        status:
          $ref: "#/components/schemas/ReplyStatus"
        type:
          type: string
          description: "`<request type>Reply`; `UnknownRequestReply` when the request carried no usable `type`."
        data:
          type: object
          nullable: true
          description: The reply payload on `Success`, `null` on every other status.
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: number
              description: "`0` on `Success`, `-1` on every other status."
            message:
              type: string
              description: Empty on `Success`; the reason otherwise, without source locations or SQL.
    ReplyStatus:
      type: string
      description: >-
        `Success`; `BadRequest` for a malformed or invalid request (wrong types, unknown filter keys, values.
        outside their enum, duplicates of unique values, broken business rules); `NotFound` when the entity an id
        refers to does not exist; `UnexpectedError` for database and infrastructure failures.
      enum:
        - Success
        - BadRequest
        - NotFound
        - UnexpectedError
    GetAllEnumsRequest:
      properties:
        type:
          type: string
          default: "GetAllEnums"
        data:
