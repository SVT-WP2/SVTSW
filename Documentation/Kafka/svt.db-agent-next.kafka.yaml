    # TEST_SETUP :: DTO
    SvtTestSetupDto:
      type: object
      required:
        - id
        - name
        - defaultConfigId
        - generalLocation
      properties:
        id:
          type: number
        name:
          type: string
        defaultConfigId:
          type: number
        generalLocation:
          type: string
    SvtTestSetupCreateDto:
      type: object
      required:
        - name
        - generalLocation
        - defaultConfig
      properties:
        name:
          type: string
        generalLocation:
          type: string
        defaultConfig:
          type: object
          required:
            - name
            - configBody
          properties:
            name:
              type: string
            configBody:
              type: string
              description: Stringified JSON with default configuration for the test setup, in the correct format.
            note:
              type: string
              nullable: true
    SvtTestSetupUpdateDefaultConfigDto:
      type: object
      required:
        - defaultConfigId
      properties:
        defaultConfigId:
          type: number
          description: An existing config of this setup (Q20); the one the TestAgent loads when the setup is selected.
    # TEST_SETUP_CONFIG :: DTO
    SvtTestSetupConfigDto:
      type: object
      required:
        - id
        - setupId
        - name
        - note
        - createdAt
      properties:
        id:
          type: number
        setupId:
          type: number
        name:
          type: string
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          description: Date only in format `2025-06-03`
    # TEST SETUP CONFIG BODY :: DTO
    SvtTestSetupConfigBodyDto:
      type: object
      required:
        - id
        - configBody
      properties:
        id:
          type: number
        configBody:
          type: string
    SvtTestSetupConfigCreateDto:
      type: object
      required:
        - setupId
        - name
        - configBody
      properties:
        setupId:
          type: number
        name:
          type: string
        configBody:
          type: string
        note:
          type: string
          nullable: true
    # TEST_TYPE :: DTO
    SvtTestTypeDto:
      type: object
      required:
        - id
        - name
        - dutTypes
      properties:
        id:
          type: number
        name:
          type: string
        dutTypes:
          type: array
          items:
            type: string
    SvtTestTypeCreateDto:
      type: object
      required:
        - name
        - dutTypes
        - testTypeConfig
      properties:
        name:
          type: string
        dutTypes:
          type: array
          items:
            type: string
        testTypeConfig:
          type: object
          required:
            - name
            - configBody
          properties:
            name:
              type: string
            configBody:
              type: string
            note:
              type: string
              nullable: true
    SvtTestTypeUpdateDto:
      type: object
      required:
        - id
        - update
      properties:
        id:
          type: number
        update:
          type: object
          required:
            - dutTypes
          properties:
            dutTypes:
              type: array
              description: Replaces the type's DUT-type list; every value must be a value of the `dutType` enum.
              items:
                type: string
    # TEST_TYPE_CONFIG :: DTO
    SvtTestTypeConfigDto:
      type: object
      required:
        - id
        - testTypeId
        - name
        - note
        - createdAt
      properties:
        id:
          type: number
        testTypeId:
          type: number
        name:
          type: string
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          description: Date only in format `2025-06-03`
    # TEST TYPE CONFIG BODY :: DTO
    SvtTestTypeConfigBodyDto:
      type: object
      required:
        - id
        - configBody
      properties:
        id:
          type: number
        configBody:
          type: string
    SvtTestTypeConfigCreateDto:
      type: object
      required:
        - testTypeId
        - name
        - configBody
      properties:
        testTypeId:
          type: number
        name:
          type: string
        configBody:
          type: string
        note:
          type: string
          nullable: true
    # TEST_TEMPLATE :: DTO
    SvtTestTemplateDto:
      required:
        - id
        - dutType
        - testTypeId
        - testTypeConfigId
        - isEnabled
      properties:
        id:
          type: number
        dutType:
          type: string
        testTypeId:
          type: number
        testTypeConfigId:
          type: number
        isEnabled:
          type: boolean
    SvtTestTemplateCreateDto:
      required:
        - dutType
        - testTypeConfigId
        - isEnabled
      properties:
        dutType:
          type: string
        testTypeConfigId:
          type: number
        isEnabled:
          type: boolean
    SvtTestTemplateUpdateDto:
      required:
        - isEnabled
      properties:
        isEnabled:
          type: boolean
    # TEST :: DTO
    SvtTestDto:
      required:
        - id
        - dutEntityName
        - dutId
        - testTypeConfigId
        - testSetupConfigId
        - createdAt
        - startedAt
        - finishedAt
        - pathToResult
        - testResultStatus
      properties:
        id:
          type: number
        dutEntityName:
          type: string
        dutId:
          type: number
        testTypeConfigId:
          type: number
        testSetupConfigId:
          type: number
        createdAt:
          type: string
          description: ISO 8601 date-time in UTC, e.g. `2025-06-03T23:59:12.000Z`
        startedAt:
          type: string
          nullable: true
          description: ISO 8601 date-time in UTC; `null` until the test is started
        finishedAt:
          type: string
          nullable: true
          description: ISO 8601 date-time in UTC; `null` until the test has finished
        pathToResult:
          type: string
          nullable: true
          description: "`null` until the test has finished"
        testResultStatus:
          allOf:
            - $ref: "#/components/schemas/SvtTestResultStatus"
          nullable: true
          description: "`null` until the test has finished"
    SvtTestCreateDto:
      required:
        - dutEntityName
        - dutId
        - testTypeConfigId
        - testSetupConfigId
      properties:
        dutEntityName:
          type: string
        dutId:
          type: number
        testTypeConfigId:
          type: number
        testSetupConfigId:
          type: number
    SvtTestStartUpdateDto:
      required:
        - startedAt
      properties:
        startedAt:
          type: string
          description: ISO 8601 date-time, e.g. `2025-06-03T23:59:12Z`
    SvtTestFinishUpdateDto:
      required:
        - finishedAt
        - pathToResult
        - testResultStatus
      properties:
        finishedAt:
          type: string
          description: ISO 8601 date-time, e.g. `2025-06-03T23:59:12Z`
        pathToResult:
          type: string
        testResultStatus:
          $ref: "#/components/schemas/SvtTestResultStatus"
    # TEST :: RESULT STATUS (the PostgreSQL enum `testResultStatus`)
    SvtTestResultStatus:
      type: string
      description: The physical result of a test run, as the test agents report it and the DB agent stores it.
      enum:
        - SUCCESS
        - PARTIAL_SUCCESS
        - FAILURE
        - ERROR
        - CANCELLED

    # ENUM :: DTO
    SvtEnumName:
      type: string
      description: >-
        The PostgreSQL enum types of schema `main`, by their database names. `chipBlockType` is the agreed name.
        (Q30); until the database type `blockType` is renamed, that is the name the reply uses.
      enum:
        - asicFamilyType
        - asicQuality
        - chipBlockType
        - moduleType
        - dutType
        - dutEntityName
        - engineeringRun
        - foundryName
        - pcLocation
        - pcModel
        - pcName
        - pcType
        - pcVendor
        - waferTech
        - waferInMachineStatus
        - waferMapOrientation
        - wpConnectionType
        - wpGeneralLocation
        - wpSwType
        - wpVendor
        - testResultStatus
