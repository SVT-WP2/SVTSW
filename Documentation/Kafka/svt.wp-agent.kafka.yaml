openapi: 3.0.3
info:
  title: SVT Wafer Prober Agent API (Kafka Command Contract)
  version: 1.2.0
  description: |
    The Kafka communication layer definitions for `SVT Wafer Prober Agent Service`.

    ### Naming Conventions
    - The path format of routes has the next format `/<KAFKA_TOPIC_NAME>/<MESSAGE_TYPE_NAME>`.
    - The reply message topic name is defined as `*.reply`, e.g:
      - request message topic `svt.wp-agent.request` => reply topic name `svt.wp-agent.request.reply`
    - Key naming: camelCase (first letter lowercase)

    ### Message Structure
    **Request Message:**
    ```
    {
      type: string,        // Command type
      data: object        // Command parameters (OPTIONAL)
    }
    ```
    
    **Reply Message:**
    ```
    {
      status: string,      // Success | Error | 
      type: string,        // Reply type
      data: object,       // Result data (OPTIONAL)
      error: {            // Error details (OPTIONAL)
        code: number,
        message: string | string[]
      }
    }
    ```


    ### Request/Reply Messages
    - Request messages are sent to `svt.wp-agent.request` topic
    - Reply messages are emitted to `svt.wp-agent.request.reply` topic
    - Request body describes Kafka Message structure. Mandatory fields: user, waferAgentName

    ### Useful Links
    - Online Swagger Editor: [https://editor-next.swagger.io](https://editor-next.swagger.io)

servers:
  - url: kafka://localhost:9096/svt.wp-agent.request
  - url: kafka://localhost:9096/svt.wp-agent.request.reply

tags:
  - name: "1. USER LEVEL"
    description: Basic operations for standard users - Initialize, Load/Unload wafer, Step to next die, Separation control, Probe alignment
  - name: "2. EXPERT LEVEL"
    description: Advanced operations - Movement control, Vision, Status queries, Database access, Automation, Kafka messaging
  - name: "3. DEVELOPER LEVEL"
    description: System-level operations - Reset agent, Advanced movement (XY/Die), Contact control, Auto-focus, Wafer alignment

