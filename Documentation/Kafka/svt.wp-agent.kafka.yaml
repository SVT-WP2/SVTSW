components:
    schemas:
      RunSequencerMessage:
        properties:
          type:
            type: string
            default: 'RunSequencer'
          data:
            type: object
            required: [ filePath ]
            properties:
              filePath:
                type: string

      RunSequencerReplyMessage:
        properties:
          type:
            type: string
            default: 'RunSequencerReply'
          data:
            $ref: '#/components/schemas/WpMachineStateDto'

      MoveChuckRowColumnMessage:
        properties:
          type:
            type: string
            default: 'MoveChuckRowColumn'
          data:
            type: object
            description: Auto-detects input type - provide either (row AND col) or label
            properties:
              row:
                type: number
              col:
                type: number
              label:
                type: string

      MoveChuckRowColumnReplyMessage:
        properties:
          type:
            type: string
            default: 'MoveChuckRowColumnReply'
          data:
            $ref: '#/components/schemas/WpMachineStateDto'
            
