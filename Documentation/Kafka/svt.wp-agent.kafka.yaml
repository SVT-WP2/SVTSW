openapi: 3.0.3
info:
  title: SVT WP Agent
  description: |
    The Kafka communication layer definitions for `SVT WP Agent Service`.

    ### Naming Conventions
    - The path format of routes has the next format `/<KAFKA_TOPIC_NAME>/<MESSAGE_TYPE_NAME>`.
    - The reply message topic name is define by the global SVT naming conventions `*.reply`, e.g:
      - request message topic `svt.db-agent.request` => reply topic name `svt.db-agent.request.reply`
    - Each message structure follows the global SVT naming conventions

    ### GET Request Meaning
    - Request body describes Kafka Message structure
    - In response there will always be a reply message
      - the corresponding message will be emitted to the relevant *.reply topic as a reply to that message.
    
    ### POST Request Meaning
    - These messages are emitted by the service itself to notify other services about certain events
    - Request body describes Kafka Message structure    

    ### Useful Links
    - Online Swagger Editor: [https://editor-next.swagger.io](https://editor-next.swagger.io)
    - SVT Kafka Naming Conventions: [README](https://github.com/SVT-WP2/SVTSW/blob/master/Documentation/Kafka/SvtKafkaConventions.md)
  version: 0.0.1

paths:
  /svt.wp-agent.request/LoadWafer:
    get:
      tags:
        - Common Commands
      summary: Load Wafer to the Wafer Probe Machine
      description: Emits reply message when the wafer load process is completed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: '#/components/schemas/RequestMessage'
                - $ref: '#/components/schemas/LoadWaferMessage'
      responses:
        '200':
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ReplyMessage'
                  - $ref: '#/components/schemas/LoadWaferReplyMessage'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  
  /svt.wp-agent.request/UnloadWafer:
    get:
      tags:
        - Common Commands
      summary: Unload Wafer from the Wafer Probe Machine
      description: Emits reply message when the unload process is completed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: '#/components/schemas/RequestMessage'
                - $ref: '#/components/schemas/UnloadWaferMessage'
      responses:
        '200':
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ReplyMessage'
                  - $ref: '#/components/schemas/UnloadWaferReplyMessage'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  
  /svt.wp-agent.request/GetWpMachineState:
    get:
      tags:
        - Common Commands
      summary: Get Current Wafer Probe Machine State
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: '#/components/schemas/RequestMessage'
                - $ref: '#/components/schemas/GetWpMachineStateMessage'
      responses:
        '200':
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ReplyMessage'
                  - $ref: '#/components/schemas/GetWpMachineStateReplyMessage'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"

  /svt.wp-agent.request/SetChuckZPositionState:
    get:
      tags:
        - Chuck
      summary: Set Chuck Z Position
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: '#/components/schemas/RequestMessage'
                - $ref: '#/components/schemas/SetChuckZPositionStateMessage'
      responses:
        '200':
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ReplyMessage'
                  - $ref: '#/components/schemas/SetChuckZPositionStateReplyMessage'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"

  /svt.wp-agent.request/MoveChuckHome:
    get:
      tags:
        - Chuck
      summary: Move Chuck to Home Position
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: '#/components/schemas/RequestMessage'
                - $ref: '#/components/schemas/MoveChuckHomeMessage'
      responses:
        '200':
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ReplyMessage'
                  - $ref: '#/components/schemas/MoveChuckHomeReplyMessage'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"

  /svt.wp-agent.request/MoveChuckDie:
    get:
      tags:
        - Chuck
      summary: Move Chuck to particular Die on the Wafer Map
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: '#/components/schemas/RequestMessage'
                - $ref: '#/components/schemas/MoveChuckDieMessage'
      responses:
        '200':
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ReplyMessage'
                  - $ref: '#/components/schemas/MoveChuckDieReplyMessage'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"

  /svt.wp-agent.request/MoveChuckAsic:
    get:
      tags:
        - Chuck
      summary: Move Chuck to particular ASIC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              allOf:
                - $ref: '#/components/schemas/RequestMessage'
                - $ref: '#/components/schemas/MoveChuckAsicMessage'
      responses:
        '200':
          description: Reply Message
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ReplyMessage'
                  - $ref: '#/components/schemas/MoveChuckAsicReplyMessage'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
  
  /svt.wp-agent.event/WpMachineStateChanged:
    post:
      tags:
        - Events
      summary: Wafer Probe Machine State Event
      description: Emits each 2 seconds to notify about the current state of the Wafer Probe Machine
      responses:
        '200':
          description: Message Body
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/EventMessage'
                  - $ref: '#/components/schemas/WpMachineStateChangedMessage'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyMessage"
components:
  schemas:
    RequestMessage:
      type: object
      required:
        - type
      properties:
        type:
          type: string
        data:
          type: object
    ReplyMessage:
      type: object
      required:
        - status
        - type
      properties:
        status:
          $ref: "#/components/schemas/ReplyStatus"
        type:
          type: string
        data:
          type: object
        error:
          type: object
          required:
            - message
          properties:
            code:
              type: number
            message:
              type: string
    EventMessage:
      type: object
      required:
        - type
      properties:
        type:
          type: string
        data:
          type: object
    ReplyStatus:
      type: string
      enum:
        - Success
        - BadRequest
        - NotFound
        - UnexpectedError
    #          
    # LOAD WAFER
    #
    LoadWaferMessage:
      properties:
        type:
          type: string
          default: 'LoadWafer'
        data:
          type: object
          required:
            - wpMachineId
            - waferId
            - orientation
          properties:
            wpMachineId:
              type: number
              description: Wafer Probe Machine id
            waferId:
              type: number
              description: Wafer id to be loaded
            orientation:
              type: string
              description: Wafer id to be loaded

    LoadWaferReplyMessage:
      properties:
        type:
          type: string
          default: 'LoadWaferReply'
        data:
          $ref: "#/components/schemas/WpMachineStateDto"
    #          
    # UNLOAD WAFER
    #
    UnloadWaferMessage:
      properties:
        type:
          type: string
          default: 'UnloadWafer'
        data:
          type: object
          required:
            - wpMachineId
          properties:
            wpMachineId:
              type: number
              description: Wafer Probe Machine id

    UnloadWaferReplyMessage:
      properties:
        type:
          type: string
          default: 'UnloadWaferReply'
        data:
          $ref: "#/components/schemas/WpMachineStateDto"

    #
    # WP MACHINE STATE CHNAGED
    #
    WpMachineStateChangedMessage:
      properties:
        type:
          type: string
          default: 'WpMachineStateChanged'
        data:
          $ref: "#/components/schemas/WpMachineStateDto"

    #
    # GET WP MACHINE STATE
    #
    GetWpMachineStateMessage:
      properties:
        type:
          type: string
          default: 'GetWpMachineState'
        data:
          type: object
          required:
            - wpMachineId
          properties:
            wpMachineId:
              type: number
              description: Wafer Probe Machine id
    
    GetWpMachineStateReplyMessage:
      properties:
        type:
          type: string
          default: 'GetWpMachineStateReply'
        data:
          $ref: "#/components/schemas/WpMachineStateDto"

    #
    # SET CHUCK Z POSITION
    #
    SetChuckZPositionStateMessage:
      properties:
        type:
          type: string
          default: 'SetChuckZPositionState'
        data:
          type: object
          required:
            - wpMachineId
            - chuckZPositionState
          properties:
            wpMachineId:
              type: number
              description: Wafer Probe Machine id
            chuckZPositionState:
              $ref: "#/components/schemas/WpChuckZPositionState"

    SetChuckZPositionStateReplyMessage:
      properties:
        type:
          type: string
          default: 'SetChuckZPositionStateReply'
        data:
          $ref: "#/components/schemas/WpMachineStateDto"

    #
    # MOVE CHUCK HOME
    #
    MoveChuckHomeMessage:
      properties:
        type:
          type: string
          default: 'MoveChuckHome'
        data:
          type: object
          required:
            - wpMachineId
          properties:
            wpMachineId:
              type: number
              description: Wafer Probe Machine id

    MoveChuckHomeReplyMessage:
      properties:
        type:
          type: string
          default: 'MoveChuckHomeReply'
        data:
          $ref: "#/components/schemas/WpMachineStateDto"

    #
    # MOVE CHUCK DIE
    #
    MoveChuckDieMessage:
      properties:
        type:
          type: string
          default: 'MoveChuckDie'
        data:
          type: object
          required:
            - wpMachineId
            - waferMapDiePosition
          properties:
            wpMachineId:
              type: number
              description: Wafer Probe Machine id
            waferMapDiePosition:
              $ref: "#/components/schemas/WaferMapDiePosition"

    MoveChuckDieReplyMessage:
      properties:
        type:
          type: string
          default: 'MoveChuckDieReply'
        data:
          $ref: "#/components/schemas/WpMachineStateDto"

    #
    # MOVE CHUCK ASIC
    #
    MoveChuckAsicMessage:
      properties:
        type:
          type: string
          default: 'MoveChuckAsic'
        data:
          type: object
          required:
            - wpMachineId
            - waferMapDiePosition
          properties:
            wpMachineId:
              type: number
              description: Wafer Probe Machine id
            asicId:
              type: number
              description: ASIC id

    MoveChuckAsicReplyMessage:
      properties:
        type:
          type: string
          default: 'MoveChuckAsicReply'
        data:
          $ref: "#/components/schemas/WpMachineStateDto"

    #
    # DTOs
    #
    # TODO: Not sure what else can be a part of the Current WP Machine State, and if all the fields make sense. This is just a proposal.
    # TODO: but the idea is to have all the information we know about the machine itself, chuck position (X,Y, Z, current Die index, current AsicId), etc.
    WpMachineStateDto:
      type: object
      required:
        - wpMachineId
        - wpMachineStatus
      properties:
        wpMachineId:
          type: number
          description: Wafer Probe Machine id
        wpMachineStatus:
          $ref: "#/components/schemas/WpMachineStatus"
        loadedWafer:
          properties:
            waferId:
              type: number
              description: Loaded Wafer id. If no wafer is loaded, this value is null
              nullable: true
            orientation:
              type: string
              description: Loaded Wafer orientation. If no wafer is loaded, this value is null.
              nullable: true
          nullable: true
          description: Loaded Wafer information. Returns null if no wafer is loaded.
        installedProbeCard:
          properties:
            probeCardId:
              type: number
              description: Installed Probe Card id. If no Probe Card is Installed, this value is null
              nullable: true
            orientation:
              type: string
              description: Installed Probe Card orientation. If no Probe Card is Installed, this value is null.
              nullable: true
          nullable: true
          description: Installed Probe Card  information. Returns null if no Probe Card is Installed.
        openedProjectId:
          type: number
          description: Opened Project id. If no Project is opened, this value is null
          nullable: true
        waferMapDiePosition:
          $ref: "#/components/schemas/WaferMapDiePosition"
        chuckAbsolutePosition:
          $ref: "#/components/schemas/ChuckAbsolutePosition"
        chuckZPositionState:
          $ref: "#/components/schemas/WpChuckZPositionState"

    WaferMapDiePosition:
      required:
        - colIndex
        - rowIndex
      properties:
        colIndex:
          type: number
          description: Column index of the Wafer Map
        rowIndex:
          type: number
          description: Column index of the Wafer Map
        subsiteIndex:
          type: number
          description: Subsite index of the Wafer Map. The value is null if not relevant
          nullable: true

    ChuckAbsolutePosition:
      description: Chuck absolute position in micrometers
      required:
        - x
        - y
        - z
      properties:
        x:
          type: number
          description: Chuck absolute X position in micrometers
        y:
          type: number
          description: Chuck absolute Y position in micrometers
        z:
          type: number
          description: Chuck absolute Z position in micrometers

    # TODO: not sure if the list of available states is complete ...
    WpMachineStatus:
      type: string
      enum:
        - Idle
        - Processing
        - Offline
        - Error

    # TODO: not sure if the list of available states is complete ... if "Lift" naming is correct.
    # TODO: @Angelina, please check it and rename if needed
    WpChuckZPositionState:
      type: string
      enum:      
        - Contact
        - Separation
        - Lift
